<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none" role="img" aria-labelledby="authShowcaseTitle">
  <title id="authShowcaseTitle">Resume template preview illustration</title>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0c2340" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c2340" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="210" cy="250" rx="160" ry="50" fill="url(#glow)"/>

  <!-- Back resume -->
  <g transform="translate(52 38) rotate(-9 90 120)" filter="url(#cardShadow)">
    <rect width="180" height="248" rx="10" fill="#ffffff"/>
    <rect x="0" y="0" width="180" height="6" rx="10" fill="#0c2340"/>
    <rect x="16" y="22" width="72" height="10" rx="3" fill="#0c2340"/>
    <rect x="16" y="38" width="48" height="6" rx="2" fill="#f97316" opacity="0.9"/>
    <rect x="120" y="22" width="44" height="5" rx="2" fill="#e2e8f0"/>
    <rect x="120" y="32" width="36" height="5" rx="2" fill="#e2e8f0"/>
    <line x1="16" y1="58" x2="164" y2="58" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="68" width="40" height="5" rx="2" fill="#0c2340" opacity="0.85"/>
    <rect x="16" y="82" width="148" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="92" width="140" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="102" width="132" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="118" width="40" height="5" rx="2" fill="#0c2340" opacity="0.85"/>
    <rect x="16" y="132" width="148" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="142" width="136" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="158" width="36" height="5" rx="2" fill="#0c2340" opacity="0.85"/>
    <rect x="16" y="172" width="64" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="86" y="172" width="52" height="18" rx="4" fill="#f1f5f9"/>
    <rect x="16" y="200" width="148" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="210" width="128" height="4" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Front resume -->
  <g transform="translate(168 24) rotate(5 100 130)" filter="url(#cardShadow)">
    <rect width="200" height="268" rx="10" fill="#ffffff"/>
    <rect x="0" y="0" width="200" height="8" rx="10" fill="#0c2340"/>
    <rect x="18" y="26" width="88" height="12" rx="3" fill="#0c2340"/>
    <rect x="18" y="44" width="56" height="7" rx="2" fill="url(#accentBar)"/>
    <rect x="130" y="26" width="52" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="130" y="38" width="42" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="130" y="50" width="48" height="6" rx="2" fill="#e2e8f0"/>
    <line x1="18" y1="68" x2="182" y2="68" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="18" y="78" width="48" height="6" rx="2" fill="#0c2340"/>
    <rect x="18" y="92" width="164" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="18" y="104" width="156" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="18" y="116" width="148" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="18" y="132" width="44" height="6" rx="2" fill="#0c2340"/>
    <circle cx="26" cy="154" r="3" fill="#f97316"/>
    <rect x="36" y="150" width="140" height="5" rx="2" fill="#cbd5e1"/>
    <circle cx="26" cy="168" r="3" fill="#f97316"/>
    <rect x="36" y="164" width="132" height="5" rx="2" fill="#cbd5e1"/>
    <circle cx="26" cy="182" r="3" fill="#f97316"/>
    <rect x="36" y="178" width="128" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="18" y="198" width="40" height="6" rx="2" fill="#0c2340"/>
    <rect x="18" y="212" width="72" height="22" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <rect x="22" y="218" width="40" height="4" rx="2" fill="#f97316" opacity="0.7"/>
    <rect x="22" y="226" width="56" height="3" rx="1.5" fill="#fdba74"/>
    <rect x="98" y="212" width="58" height="22" rx="5" fill="#f1f5f9"/>
    <rect x="102" y="218" width="36" height="4" rx="2" fill="#94a3b8"/>
    <rect x="102" y="226" width="48" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>

  <!-- PDF badge -->
  <g transform="translate(318 210)" filter="url(#badgeShadow)">
    <rect width="88" height="36" rx="10" fill="#ffffff"/>
    <rect x="12" y="10" width="18" height="16" rx="3" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="21" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#f97316">PDF</text>
    <text x="52" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0c2340">Ready</text>
  </g>

  <!-- ATS chip -->
  <g transform="translate(24 200)" filter="url(#badgeShadow)">
    <rect width="96" height="32" rx="10" fill="#ffffff"/>
    <circle cx="20" cy="16" r="8" fill="#ecfdf5"/>
    <path d="M16 16l2.5 2.5L24 13" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0c2340">ATS-safe</text>
  </g>
</svg>
