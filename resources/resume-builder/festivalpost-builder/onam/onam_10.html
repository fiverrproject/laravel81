            width: 100%;

        }

            margin: auto;
            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 40px;
      }

         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: black;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid black;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid black;
         border-top: transparent;
         border-bottom: transparent;
      }

</head>
