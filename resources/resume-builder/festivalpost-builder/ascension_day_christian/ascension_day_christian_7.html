         position: absolute;
         bottom: 23px;
         margin: 0px 0px 0 25px;

      }

         display: flex;
         list-style: none;
         margin: 0;
         padding: 10px;

         justify-content: center;
         align-items: center;
         padding-inline-start: 0;
      }

         align-items: center;
         margin: 0px 5px;
         color: #fff;
         font-size: 32px;
         padding: 5px;
