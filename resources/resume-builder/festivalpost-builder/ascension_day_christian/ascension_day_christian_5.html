<body>
    <div class="container bg">
        <div class="header">
            {{#if companyLogo}}
            <div class="logo">
                <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <span style="color: #5497b9; padding: 25px; margin: 5px 0px; font-size: 50px; font-weight: bold; background-color: #161031;
              border-top-right-radius: 50px; border-bottom-right-radius: 50px;">
                {{name}}
            </span>
            {{/if}}
        </div>
        <div class="footer">
            <ul class="contact">
                {{#if phone}}
                <li>
                    <span
                        style="color: #fff; width: 40px; height: 40px; border-radius: 50%; background: #28793c; display: flex; justify-content: center; align-items: center; margin-right: 5px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
