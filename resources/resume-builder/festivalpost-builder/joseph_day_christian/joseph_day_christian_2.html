   <div class="container">
      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <h2 style="text-align: center;color: rgb(0, 0, 0);margin: 0px;font-size: 3rem; padding: 30px 0 0 30px;">
            {{name}}

         {{/if}}
         <div class="footer">
            <div style="display: flex; gap: 10px; font-size: 40px; justify-content: center;">
               <div class="left-side">
                  {{#if phone}}

                        style="color: white; width: 50px; height: 50px; border-radius: 50%; background: #28793C; display: flex; justify-content: center; align-items: center; margin-right: 10px;">

                  {{/if}}
                  {{#if email}}

                        style="color: white; width: 50px; height: 50px; border-radius: 50%; background: #C55263; display: flex; justify-content: center; align-items: center; margin-right: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor"
                           class="bi bi-envelope-at-fill" viewBox="0 0 16 16">

                        </svg>

                  {{/if}}
                  {{#if website}}
                  <div class="mb-1"><span
                        style="color: white; width: 50px; height: 50px; border-radius: 50%; background: #596D8C; display: flex; justify-content: center; align-items: center; margin-right: 10px;">

                        </svg>
                     </span></div>
                  {{/if}}
               </div>
               <div class="right-side">
                  {{#if phone}}<div class="mb-1">{{phone}}</div>{{/if}}
                  {{#if email}}<div class="mb-1">{{email}}</div>{{/if}}
                  {{#if website}}<div class="mb-1">{{website}}</div>{{/if}}
               </div>
            </div>
            {{#if address}}
            <div class="address">
               <div class="address-header"
                  style="display: inline-block; border-bottom: 1px solid black; margin-bottom: 5px;">
                  <svg width="40" height="40" fill="currentColor" viewBox="0 0 511.953 511.953" xml:space="preserve">
                     <g transform="translate(-1)">
                        <g>
                           <g>

                          C278.328,158.865,268.771,149.287,256.995,149.287z" />
                              <path d="M365.518,38.887C325.987,6.311,274.04-6.639,223.011,3.239C154.147,16.615,100.152,72.273,88.718,141.735
                          c-6.784,41.003,0.725,81.216,21.696,116.267l8.704,14.528c27.861,46.443,56.64,94.485,79.701,143.893l38.848,83.221

                          c-35.285,0-64-28.715-64-64s28.715-64,64-64s64,28.715,64,64S292.28,234.62,256.995,234.62z" />
                           </g>
                        </g>
                     </g>
                  </svg>
               </div>
               <div>{{address}}</div>
            </div>
            {{/if}}
         </div>
      </div>
</body>

</html>
