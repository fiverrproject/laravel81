      {{else}}

      {{/if}}

            {{#if phone}}
         <div
            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;background-color: #dd7200a2;;">

               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"

                  </svg>
               </div>
               <div>
                  {{email}}
