      .logo {
            width: 290px;
            height: 200px;
        }

        .logo img {
            width: 100%;
            object-fit: contain;
        }

        footer {
            position: absolute;
            bottom: 0px;
            width: 100%;
            background-color: #ffffffdb;
            font-size: 40px;
        }

        .svg-icon {
            margin-right: 8px;
            border-radius: 50%;
            background-color: #2f1a01;
            height: 40px;
            width: 40px;
            color: rgb(255, 255, 255);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .social li {
            width: 50px;
            height: 50px;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            border-radius: 8px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 8px;
        }

        .fb svg path {
            color: #1877f2;
        }

        .insta svg path {
            color: #e95950;
        }

        .x svg path {
            color: #00acee;
        }

        .in svg path {
            color: #0077b5;
        }

    <div class="container">
        <div class="bg">
            <div style="display: flex; justify-content: space-between; align-items: start; padding: 35px;">
                {{#if companyLogo}}
                <div class="logo">
                    <img src="{{companyLogo}}" alt="Brand logo">
                </div>
                {{else}}

                    {{name}}
                </h2>
                {{/if}}

                        <div class="svg-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"

                            </svg>
                        </div>
                        <div>
                            {{email}}
                        </div>
                    </div>
                    {{/if}}
                </div>
            </footer>
        </div>
    </div>
</body>
