        }

            margin: auto;
            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 38px;
         color: white;
      }

         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: white;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid white;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid white;
         border-top: transparent;
         border-bottom: transparent;
      }

<body>
   <div class="container">
      <div class="bg">
         <div style="display: flex; justify-content: space-between; align-items: start; padding: 35px;">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 45px; color: white; padding: 0px;">
               {{name}}
            </h2>
            {{/if}}
         </div>

         <footer>
            <div
               style="display: flex; flex-direction: column; gap:25px; justify-content: center; padding: 30px; align-items: center;">
