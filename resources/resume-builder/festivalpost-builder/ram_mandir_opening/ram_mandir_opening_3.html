      }

      .footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         padding: 10px 0px;
         background-color: #795548bd;
        
      }

      .contact,
      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
         justify-content: center;
         align-items: center;
      }

      .social li {
         width: 25px;
         height: 25px;
         box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
         border-radius: 8px;
         background: #fff;
         display: flex;
         justify-content: center;
         align-items: center;
         margin-right: 5px;
      }

      .contact li {
         display: flex;
         align-items: center;
         margin: 0px 10px;
         color: #000;
      }
   </style>
</head>
