<body>
   <div class="container">
      <div class="bg">
         <div style="display: flex; justify-content: center; align-items: center; padding: 30px;">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; color: #ffffff; font-size: 40px;">
               {{name}}
            </h2>
            {{/if}}

         </div>
