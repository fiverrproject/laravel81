         text-align: center;

         width: 290px;
         height: auto;
         object-fit: contain;
      }

         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;

         color: #fff4f4;

         margin-right: 8px;
         padding: 4px;
         color: #ffffff;
      }

         width: 100%;
         position: absolute;
         top: 85rem;
         font-size: 2.5rem;

         {{/if}}
