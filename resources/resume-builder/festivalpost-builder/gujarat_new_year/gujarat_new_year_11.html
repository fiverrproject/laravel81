         /* width: 100%; */
         text-align: center;
         padding: 54px 0 0 0;
      }

         width: 290px;
         height: auto;
         object-fit: contain;
      }

         margin-right: 10px;
         border-radius: 50%;
         height: 50px;
         width: 50px;
         border: 1px solid;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         font-size: 37px;
         color: white;
      }

<body>
   <div class="container">
      <div class="bg">
         <div>
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="text-align: center; font-size: 3rem; color: rgb(255, 255, 255); margin: 0px; padding: 10px;">
               {{name}}
            </h2>
            {{/if}}
         </div>

         <div class="footer">
               {{#if phone}}

            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;background-color: #efc0ff3d;;">

               <div class="svg-icon">

            {{/if}}

               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"
                     class="bi bi-envelope-fill" viewBox="0 0 16 16">
