            width: 100%;
            text-align: center;
        }

            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;

         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: #70291F;
         text-shadow: 0px 0px 20px #fff3f3;
      }

         margin-right: 8px;
         padding: 4px;
         color: #48320a;
      }

      footer {
         width: 100%;
         position: absolute;
         top: 85rem;
         font-size: 2.5rem;

         {{else}}

            <h2 class="name">
               {{name}}
            </h2>
         </div>
         {{/if}}
