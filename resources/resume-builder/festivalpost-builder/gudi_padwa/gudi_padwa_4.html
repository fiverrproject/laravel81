      }

         width: 290px;
         height: 290px;
         height: auto;
         object-fit: contain;
      }

         margin: 0 52px 0 0;
         padding-top: 35px;
         text-align: right;
         font-size: 3rem;
         font-family: system-ui;
         color: #000000;
         text-shadow: 0px 0px 20px #fff3f3;
      }

         margin-right: 8px;
         padding: 4px;
         color: #000000;
      }

         width: 100%;
         position: absolute;
         bottom: 5rem;
         font-size: 2rem;
         font-family: system-ui;
         color: #000000;
      }

<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}

            <img src="{{companyLogo}}" alt="Brand logo">

         {{else}}
