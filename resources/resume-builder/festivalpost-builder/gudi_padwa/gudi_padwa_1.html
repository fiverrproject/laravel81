         padding: 54px 0 0 54px;
      }

      .logo img {
         width: 290px;
         height: 290px;
         height: auto;
         object-fit: contain;
      }

      .name {
         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: #48320a;
         text-shadow: 0px 0px 20px #fff3f3;
         text-align: center;
      }

      .svg-icon {
         margin-right: 8px;
         padding: 4px;
         color: #48320a;
      }

      footer {
         width: 100%;
         position: absolute;
         top: 79rem;
         font-size: 2.5rem;
         font-family: system-ui;
         color: #48320a;
         /* text-shadow: 0px 0px 20px black; */
      }
   </style>
</head>

            <div style="  text-align-last: center; margin: auto;">
               {{address}}
            </div>
            {{/if}}
         </footer>
      </div>
   </div>
</body>


</html>
