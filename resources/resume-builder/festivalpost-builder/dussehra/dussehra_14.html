                     d="M19.268,16.045c-0.355-0.79-0.729-0.806-1.068-0.82c-0.277-0.012-0.593-0.011-0.909-0.011c-0.316,0-0.83,0.119-1.265,0.594c-0.435,0.475-1.661,1.622-1.661,3.956c0,2.334,1.7,4.59,1.937,4.906c0.237,0.316,3.282,5.259,8.104,7.161c4.007,1.58,4.823,1.266,5.693,1.187c0.87-0.079,2.807-1.147,3.202-2.255c0.395-1.108,0.395-2.057,0.277-2.255c-0.119-0.198-0.435-0.316-0.909-0.554s-2.807-1.385-3.242-1.543c-0.435-0.158-0.751-0.237-1.068,0.238c-0.316,0.474-1.225,1.543-1.502,1.859c-0.277,0.317-0.554,0.357-1.028,0.119c-0.474-0.238-2.002-0.738-3.815-2.354c-1.41-1.257-2.362-2.81-2.639-3.285c-0.277-0.474-0.03-0.731,0.208-0.968c0.213-0.213,0.474-0.554,0.712-0.831c0.237-0.277,0.316-0.475,0.474-0.791c0.158-0.317,0.079-0.594-0.04-0.831C20.612,19.329,19.69,16.983,19.268,16.045z"

            <div style="font-size: 35px;">
               {{phone}}
            </div>
         </div>
      </div>
      {{/if}}

      {{#if companyLogo}}
      <div class="logo">
         <img src="{{companyLogo}}" alt="Brand logo">
      </div>
      {{else}}
      <h2 style="color: #000000; margin: 0px; font-size: 50px;  padding: 25px; text-align: end;">
         {{name}}
      </h2>
      {{/if}}

      <div class="footer">
            {{#if phone}}
         <div
            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;background-color: rgba(129, 129, 129, 0.272);">
            <div style="display: flex;align-items: center; margin: 0 10px;">
               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"
                     class="bi bi-telephone-fill" viewBox="0 0 16 16">
                     <path fill-rule="evenodd"
                        d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z" />
                  </svg>
               </div>
               <div>{{phone}}</div>
            </div>
            {{/if}}
            {{#if email}}
            <div style="display: flex;align-items: center; margin: 0 10px;">
               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"
                     class="bi bi-envelope-fill" viewBox="0 0 16 16">
                     <path
                        d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z" />
                  </svg>
               </div>
               <div>
                  {{email}}
               </div>
            </div>
         </div>
         {{/if}}
         <div style="display: flex; align-items: center; justify-content: center; padding: 20px;">
            {{#if address}}
            <div class="svg-icon">
               <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor" class="bi bi-geo-fill"
                  viewBox="0 0 16 16">
                  <path fill-rule="evenodd"
                     d="M4 4a4 4 0 1 1 4.5 3.969V13.5a.5.5 0 0 1-1 0V7.97A4 4 0 0 1 4 3.999zm2.493 8.574a.5.5 0 0 1-.411.575c-.712.118-1.28.295-1.655.493a1.3 1.3 0 0 0-.37.265.3.3 0 0 0-.057.09V14l.002.008.016.033a.6.6 0 0 0 .145.15c.165.13.435.27.813.395.751.25 1.82.414 3.024.414s2.273-.163 3.024-.414c.378-.126.648-.265.813-.395a.6.6 0 0 0 .146-.15l.015-.033L12 14v-.004a.3.3 0 0 0-.057-.09 1.3 1.3 0 0 0-.37-.264c-.376-.198-.943-.375-1.655-.493a.5.5 0 1 1 .164-.986c.77.127 1.452.328 1.957.594C12.5 13 13 13.4 13 14c0 .426-.26.752-.544.977-.29.228-.68.413-1.116.558-.878.293-2.059.465-3.34.465s-2.462-.172-3.34-.465c-.436-.145-.826-.33-1.116-.558C3.26 14.752 3 14.426 3 14c0-.599.5-1 .961-1.243.505-.266 1.187-.467 1.957-.594a.5.5 0 0 1 .575.411" />
               </svg>
            </div>
            <div>
               {{address}}
            </div>
         </div>
         {{/if}}
      </div>
   </div>
</body>

</html>
