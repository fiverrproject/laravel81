            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 8px;

        }

            color: #e95950;
        }

        .x svg path {
            color: #00acee;
        }

            color: #0077b5;
        }

                <div class="logo">
                    <img src="{{companyLogo}}" alt="Brand logo">
                </div>
                {{else}}
                <h2 style="margin: 0px; font-size: 40px;">
                    {{name}}
                </h2>
                {{/if}}
