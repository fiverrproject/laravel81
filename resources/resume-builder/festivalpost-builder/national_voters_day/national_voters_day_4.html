      .logo {
            width: 100%;
            text-align: center;
        }

        .logo img {
            margin: auto;
            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         background-color: #fdfdfda8;
         font-size: 38px;
      }

      .svg-icon {
         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: blue;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid blue;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid blue;
         border-top: transparent;
         border-bottom: transparent;
      }
   </style>
</head>
