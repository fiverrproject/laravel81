      .logo {
         width: 150px;
      }

         width: 250px;
         height: 215px;
         object-fit: contain;
      }

      .footer {
         width: 100%;
         position: absolute;
         bottom: 0px;
         font-size: 38px;
      }

      .coros_contact {
         display: flex;
         justify-content: center;
         align-items: center;
         color: #fff;
         padding: 7px;
         border-right: 1px solid #089ba5;
         border-left: 1px solid #089ba5;
         color: black;
         border-radius: 15px;
      }

      .numberdata {
         padding: 4px 4px 4px 15px;
         background-color: #089ba5;
         border-top-left-radius: 25px;
         display: flex;
         border-bottom-left-radius: 25px;
         font-weight: 600;
         color: #fff;
         align-items: center;
      }

<body>
   <div class="container bg">
      <div style="display: flex; align-items: start; justify-content: space-between; padding: 25px;">

         {{/if}}
      </div>
   </div>
