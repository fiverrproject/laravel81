      .logo {
         width: 150px;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 20px;
         object-fit: contain;
      }

      .footer {
         width: 100%;
         position: absolute;
         bottom: 0px;
         background-color: #ffffff;
      }

      .coros_contact {
         display: flex;
         justify-content: center;
         align-items: center;
         color: #232323;
         font-size: 40px;
         padding: 7px;
      }

      .numberdata {
         padding: 4px 4px 4px 15px;
         background: #5d5d5d;
         color: #ffffff;
         border-top-left-radius: 25px;
         display: flex;
         border-bottom-left-radius: 25px;
         font-weight: 600;
         align-items: center;
         margin-top: 10px;
      }

</head>

<body>
   <div class="container bg">
      <div style="display: flex; align-items: start; justify-content: space-between; padding: 15px 0px 0px 15px;">
         {{#if companyLogo}}
