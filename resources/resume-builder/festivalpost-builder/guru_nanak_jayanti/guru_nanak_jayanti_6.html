         text-align: center;
         padding: 54px 0 0 0;
      }

         width: 290px;
         height: auto;
         object-fit: contain;
      }

         margin-right: 10px;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      }

         position: absolute;
         bottom: 0;
         width: 100%;

        color: #fff;

      }

<body>
   <div class="container">
      <div class="bg">
         <div>
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="text-align: center; font-size: 3rem; color: rgb(255, 255, 255); margin: 0px; padding: 10px;">
               {{name}}
            </h2>
            {{/if}}
         </div>

         <div class="footer">
            {{#if phone}}
         <div
            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;background-color: #ffffff61;">

               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"
                     class="bi bi-telephone-fill" viewBox="0 0 16 16">
                     <path fill-rule="evenodd"

            </div>
            {{/if}}
            {{#if email}}

               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"
                     class="bi bi-envelope-fill" viewBox="0 0 16 16">
                     <path
                        d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z" />
