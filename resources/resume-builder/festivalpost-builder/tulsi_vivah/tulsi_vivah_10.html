      .footer {
         position: absolute;
         bottom: 5px;
         width: 100%;
         /* background-color: #191a1de8; */
      }
      .svgicon{
         margin-right: 12px;
        color: black; background-color: white;padding: 10px;border-radius: 50%;
      }
   </style>
</head>

                  </svg>
                  <span>
                     {{website}}

         </div>
      </div>
   </div>
