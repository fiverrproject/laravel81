      .logo {
            width: 100%;
            text-align: center;
        }

        .logo img {
            margin: auto;
            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         background-color: #ffffff;
         font-size: 35px;
      }

      .svg-icon {
         margin-right: 8px;
         border-radius: 50%;
         background-color: #ee5757;
         height: 40px;
         width: 40px;
         color: white;
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .social li {
         width: 50px;
         height: 50px;
         box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
         border-radius: 8px;
         background: white;
         display: flex;
         justify-content: center;
         align-items: center;
         margin-right: 8px;
      }

      .fb svg path {
         color: #1877f2;
      }

      .insta svg path {
         color: #e95950;
      }

      .x svg path {
         color: #00acee;
      }

      .in svg path {
         color: #0077b5;
      }
