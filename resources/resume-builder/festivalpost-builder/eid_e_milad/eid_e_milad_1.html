            text-align: center;
        }

            height: 215px;
            padding-top: 15px;
            padding-left: 15px;
        }

         width: 100%;
         position: absolute;
         bottom: 0px;
         font-size: 40px;
         background: rgba(255, 233, 146, 0.94);
         padding: 5px;
      }

      .second-line {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 10px;
         justify-content: center;
         align-items: center;
      }

      .d-flex {
         margin: 0px 10px;
         display: flex;
         align-items: center;
         justify-content: center;
      }

      .website {
         text-align: center;
      }

      <div class="bg">

         <div class="logo">
