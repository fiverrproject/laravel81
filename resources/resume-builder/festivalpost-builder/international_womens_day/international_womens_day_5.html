      .logo {
         text-align: center;
      }

         margin: auto;
         width: 260px;
         height: 260px;
         padding: 20px;
         object-fit: contain;
      }

      .svg-icon {
         margin-right: 10px;
         border-radius: 50%;
         height: 50px;
         width: 50px;
         border: 1px solid;
         color: black;
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .footer {
         position: absolute;
         bottom: 15px;
         width: 100%;
         font-size: 37px;
      }

      .numberdata {
         padding: 4px 4px 4px 15px;
         background-color: #e6b4febf;
         border-top-left-radius: 25px;
         display: flex;
         border-bottom-left-radius: 25px;
         font-weight: 600;
         color: #5d21a6;
         align-items: center;
      }
   </style>
</head>

<body>
   <div class="container bg">
      <div style="display: flex; align-items: start; justify-content: space-between; padding: 15px 0px 0px 15px;">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <h2 style="color: #063970; margin: 0px; font-size: 3rem;">
            {{name}}
         </h2>
         {{/if}}

         {{#if phone}}

            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;background-color: #e6b4febf;;">
            <div style="display: flex;align-items: center; margin: 0 10px;">
               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"
                     class="bi bi-telephone-fill" viewBox="0 0 16 16">

            {{/if}}

               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"
                     class="bi bi-envelope-fill" viewBox="0 0 16 16">

            <div>

      </div>
   </div>
</body>

</html>
