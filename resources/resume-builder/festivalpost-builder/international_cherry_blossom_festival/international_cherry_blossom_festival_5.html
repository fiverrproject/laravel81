      .logo {
         width: 100%;
         text-align: end;
         margin: 0%;
         padding: 0;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 10px;
         object-fit: contain;
      }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         background-color: #ffffffdb;
         font-size: 40px;
      }

      .svg-icon {
         margin-right: 8px;
         border-radius: 50%;
         background-color: #000000;
         height: 40px;
         width: 40px;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      }

</head>

<body>
   <div class="container">
      <div class="bg">
         <div style="display: flex; justify-content: space-between; align-items: start; padding: 35px;">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; color: #ffffff; text-align: center; font-size: 40px;">
               {{name}}
            </h2>
            {{/if}}

           
         </div>

         <footer>
            <div style="display: flex; justify-content: center;gap: 3rem; padding: 30px; align-items: center;">
               {{#if phone}}
               <div style="display: flex;align-items: center; margin: 0 10px;">
                  <div class="svg-icon">
                     <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                        class="bi bi-telephone-fill" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                           d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z" />
                     </svg>
                  </div>
                  <div>{{phone}}</div>
               </div>
               {{/if}}
               {{#if email}}
               <div style="display: flex;align-items: center; margin: 0 10px;">
                  <div class="svg-icon">
                     <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                        class="bi bi-envelope-fill" viewBox="0 0 16 16">
                        <path
                           d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z" />
                     </svg>
                  </div>
                  <div>
                     {{email}}
                  </div>
               </div>
               {{/if}}
            </div>
         </footer>
      </div>
   </div>
</body>

</html>
