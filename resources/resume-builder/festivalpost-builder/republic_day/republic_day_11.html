      <div class="bg">

            {{#if companyLogo}}

            </div>
            {{else}}

               {{name}}

                     </div>
                     <div>
                        {{website}}
                     </div>
                  </div>
                  {{/if}}
               </div>
            </div>
         </footer>
      </div>
   </div>
