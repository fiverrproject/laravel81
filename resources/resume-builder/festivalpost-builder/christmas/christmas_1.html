<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <h2
            style="text-align:center;color: #ebf5ff;margin: 0px;font-size: 3rem;  padding: 30px 0 0 30px;font-family: system-ui;">

         {{/if}}

                           class="bi bi-telephone-fill" viewBox="0 0 16 16">
