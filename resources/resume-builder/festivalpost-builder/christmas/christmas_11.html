         text-align: center;
      }

         margin: auto;
         width: 260px;
         height: 260px;
         padding: 45px;
         object-fit: contain;
      }

         margin-right: 8px;
         padding: 4px;
         color: #D32F2F;
      }

         width: 100%;
         position: absolute;
         bottom: 4rem;
         font-size: 2.5rem;

<body>

         {{/if}}
