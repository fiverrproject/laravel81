         background-size: 100% 100%;
         height: 100vh;
         position: relative;
      }

      .logo {
         width: 100%;
         text-align: center;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 10px;
         object-fit: contain;
      }

      .footer {
         width: 100%;
         position: absolute;
         color: white;
         bottom: 15px;
         font-size: 40px;
      }

      .mb-1 {
         margin-bottom: 1rem;
      }

      .address {
         margin-top: 1rem;
         text-align: center;
         font-size: 38px;
         color: rgb(255, 255, 255);
      }

      .right-side {
         color: rgb(255, 255, 255);
      }
   </style>
</head>
