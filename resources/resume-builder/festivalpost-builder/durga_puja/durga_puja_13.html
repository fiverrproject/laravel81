            height: 260px;
            padding: 30px;

        }

            bottom: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.918);

<body>
    <div class="container">
        <div class="bg">
            {{#if companyLogo}}
            <div class="logo">
                <img src="{{companyLogo}}" alt="Brand logo">

            {{else}}
