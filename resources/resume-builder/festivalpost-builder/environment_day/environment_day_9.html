         background-color:#417bb8;
         border-top-right-radius: 25px;
         display: flex;
         border-bottom-right-radius: 25px;
         font-weight: 600;
         color: rgb(255, 255, 255);
         align-items: center;
      }

      .svg-icon {
         margin-right: 10px;
         border-radius: 50%;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         color: #fff;
         font-size: 37px;
         background: #417bb8;
      }
   </style>
</head>

      {{/if}}

      {{#if companyLogo}}
      <div class="logo">
         <img src="{{companyLogo}}" alt="Brand logo">
      </div>
      {{else}}
      <h2 style="color: #0d65c2; margin: 0px; font-size: 50px;  padding: 25px; text-align: end;">
         {{name}}
      </h2>
      {{/if}}



      <div class="footer">


         {{#if phone}}
         <div
            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;">
