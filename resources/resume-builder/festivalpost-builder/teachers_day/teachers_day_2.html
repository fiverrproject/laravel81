      .logo {
         width: 100%;
      }

      .logo img {
         width: 290px;
         height: 200px;
         margin-left: 35px;
         margin-top: 35px;
         object-fit: contain;
      }

      footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         background-color: #113054b0;
         font-size: 32px;
      }

      .svg-icon {
         margin-right: 8px;
         border-radius: 50%;
         background-color: #00acee;
         height: 40px;
         width: 40px;
         color: white;
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .social li {
         width: 50px;
         height: 50px;
         box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
         border-radius: 8px;
         background: white;
         display: flex;
         justify-content: center;
         align-items: center;
         margin-right: 8px;
      }

      .fb svg path {
         color: #1877f2;
      }

      .insta svg path {
         color: #e95950;
      }

      .x svg path {
         color: #00acee;
      }

      .in svg path {
         color: #0077b5;
      }
   </style>
