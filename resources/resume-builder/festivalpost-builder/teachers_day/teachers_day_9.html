      .logo {
            width: 100%;
            text-align: start;
        }

        .logo img {
            margin: auto;
            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 34px;
         background: rgba(255, 255, 255, 0.257);
      }

      .svg-icon {
         margin-right: 8px;
         border-radius: 50%;
         background-color: white;
         height: 50px;
         width: 50px;
         border: 1px solid;
         color: black;
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .social li {
         width: 50px;
         height: 50px;
         box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
         border-radius: 8px;
         background: white;
         display: flex;
         justify-content: center;
         align-items: center;
         margin-right: 8px;
      }

      .fb svg path {
         color: #1877f2;
      }

      .insta svg path {
         color: #e95950;
      }

      .x svg path {
         color: #00acee;
      }

      .in svg path {
         color: #0077b5;
      }
