         background-color: #ff5d82;;;;
         border-top-right-radius: 25px;
         display: flex;
         border-bottom-right-radius: 25px;
         /* font-weight: 600; */
         color: black;
         align-items: center;
      }

      .svg-icon {
         margin-right: 10px;
         border-radius: 50%;
         height: 50px;
         width: 50px;
         border: 1px solid;
         color: black;
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .footer {
         position: absolute;
         bottom: 5px;
         width: 100%;
         font-size: 37px;
         /* background-color: white;;; */
      }
   </style>
</head>

            <div style="font-size: 35px;">
               {{phone}}
            </div>
         </div>
      </div>
      {{/if}}

      {{#if companyLogo}}
      <div class="logo">
         <img src="{{companyLogo}}" alt="Brand logo">
      </div>
      {{else}}
      <h2 style="color: black; margin: 0px; padding:30px; text-align: end; font-size: 40px;">
         {{name}}
      </h2>
      {{/if}}



      <div class="footer">
            {{#if phone}}
         <div
            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;background-color: #fa94ab;;">
            <div style="display: flex;align-items: center; margin: 0 10px;">
               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"

                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"

                        d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z" />

         <div style="display: flex; align-items: center; justify-content: center; padding: 20px;">
            {{#if address}}

</html>
