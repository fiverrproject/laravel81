      .logo {
         width: 100%;
         text-align: center;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 10px;
         object-fit: contain;
      }

      .footer {
         width: 100%;

         bottom: 15px;
         font-size: 40px;
      }

      .mb-1 {
         margin-bottom: 1rem;
      }

      .address {
         margin-top: 2rem;
         text-align: center;
         font-size: 38px;
         color: black;
      }

      .right-side {
         color: black;
      }
   </style>
</head>
