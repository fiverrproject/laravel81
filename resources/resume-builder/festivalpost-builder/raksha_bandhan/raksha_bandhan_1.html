         text-align: center;
      }

         width: 260px;
         height: 260px;
         padding: 30px;

         position: absolute;
         bottom: 0px;
         font-size: 38px;
         padding: 10px;
         color: #fff;
         background: rgba(107, 105, 105, 0.644);
      }

         display: flex;
         list-style: none;
         margin: 0;
         padding: 10px;
         gap: 25px;
         justify-content: center;
         align-items: center;
      }

         margin: 0px 10px;
         display: flex;
         align-items: center;
         justify-content: center;
      }

      .website {
         text-align: center;
      }
