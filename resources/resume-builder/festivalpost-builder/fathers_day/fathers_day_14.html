            {{/if}}

            style="display: flex; gap: 2rem; align-items: center; justify-content: center; padding: 10px;background-color: rgb(197 197 197 / 49%);">

               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"

            {{/if}}

               <div class="svg-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" fill="currentColor"

                  </svg>
               </div>
               <div>
                  {{email}}
               </div>
            </div>
         </div>
         {{/if}}
         <div style="display: flex; align-items: center; justify-content: center; padding: 20px;">
