<body>
    <div class="container">
        <div class="bg">

            {{#if companyLogo}}
            <div class="logo">
                <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}

                style="text-align:center; color: #272727; margin: 0px;padding: 2rem 0 0 2rem ; font-size: 3rem; font-family: system-ui;">
                {{name}}
