      .logo {
         width: 150px;
      }

         width: 250px;
         height: 215px;
         object-fit: contain;
      }

      .footer {
         width: 100%;
         position: absolute;
         bottom: 0px;
         font-size: 38px;
      }

      .coros_contact {
         display: flex;
         justify-content: center;
         align-items: center;
         background: #04647c;
         color: #fff;
         padding: 7px;
      }

      .numberdata {
         padding: 4px 4px 4px 15px;
         background-color: #04647c;
         border-top-left-radius: 25px;
         display: flex;
         border-bottom-left-radius: 25px;
         font-weight: 600;
         color: #fff;
         align-items: center;
      }

<body>
   <div class="container bg">
      <div style="display: flex; align-items: start; justify-content: space-between; padding: 15px 0px 0px 15px;">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <h2 style="color: #04647c; margin: 0px;">
            {{name}}

         {{/if}}

      </div>

            style="display: flex; justify-content: space-between; align-items: center; border-bottom:1px solid #04647c;">
            {{#if website}}

               <span
                  style="color: #04647c; width: 35px; height: 35px; border-radius: 50%; background: #fff; display: flex; justify-content: center; align-items: center; margin-right: 5px;">

                  </svg>
               </span>
               <span>{{website}}</span>
            </div>
            {{/if}}

            {{#if email}}

               <span
                  style="color: #04647c; width: 35px; height: 35px; border-radius: 50%; background: #fff; display: flex; justify-content: center; align-items: center; margin-right: 5px;">

                  </svg>
               </span>
               <span>{{email}}</span>
            </div>
            {{/if}}
         </div>
         {{#if address}}
         <p style="color: #04647c; margin: 7px; text-align: center; font-size: 37px;">
            {{address}}
         </p>
         {{/if}}
      </div>
   </div>
</body>

</html>
