    <div class="container bg">
        <div class="image">
            <div class="image-box">
                {{#if companyLogo}}
                <img src="{{companyLogo}}" alt="Brand logo">
                {{/if}}
            </div>
        </div>
        <div class="name">
            {{#if name}}
            <h4>{{name}}</h4>
            {{/if}}
        </div>
    </div>
</body>
