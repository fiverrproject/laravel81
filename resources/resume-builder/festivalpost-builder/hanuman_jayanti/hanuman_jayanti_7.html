      .footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         background-color: #ffffff;
         color: #af7353;
      }

      .svgicon {
         margin-right: 12px;
         color: rgb(255 255 255);
         background-color: #d98723;
         padding: 8px;
         border-radius: 50%;
      }
   </style>
</head>
