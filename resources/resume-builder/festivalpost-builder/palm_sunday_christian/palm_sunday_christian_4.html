         height: 260px;

         width: 95.5%;
         position: absolute;
         bottom: 23px;
         margin: 0px 0px 0 25px;
         background-color: #eef0d3;
      }

         display: flex;
         list-style: none;
         margin: 0;
         padding: 10px;
         gap: 20px;
         justify-content: center;
         align-items: center;
         padding-inline-start: 0;
      }

         display: flex;
         align-items: center;
         margin: 0px 5px;

         padding: 5px;
