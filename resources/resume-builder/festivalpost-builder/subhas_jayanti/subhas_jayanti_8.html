         padding: 4px 15px 4px 4px;
         background-color: #632c2c;
         border-top-right-radius: 25px;
         display: flex;
         border-bottom-right-radius: 25px;
         font-weight: 600;
         color: rgb(255, 255, 255);
         align-items: center;
      }

      .svg-icon {
         margin-right: 10px;
         border-radius: 50%;
         height: 50px;
         width: 50px;
         border: 1px solid;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      } 

      .footer {
         position: absolute;
         bottom: 8px;
         width: 100%;
         color: #fff;
         font-size: 37px;
         /* background-color: gainsboro;;; */
      }
   </style>
</head>
