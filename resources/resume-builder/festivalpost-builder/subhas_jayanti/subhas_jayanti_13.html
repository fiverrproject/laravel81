         /* background-color: #191a1de8; */
      }

      .svgicon {
         margin-right: 12px;
         color: black;
         background-color: white;
         padding: 10px;
         border-radius: 50%;
      }
   </style>
</head>

                  </svg>
                  <span>
                     {{phone}}

                  </svg>
                  <span>
                     {{website}}

            </div>
         </div>
      </div>
   </div>
