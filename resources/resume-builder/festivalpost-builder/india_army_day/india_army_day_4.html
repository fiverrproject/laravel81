      .logo {
         text-align: center;
         padding: 15px;
      }

         width: 260px;
         height: 260px;
         padding: 30px;
         object-fit: contain;
      }

         margin: auto;
         width: 260px;
         height: 260px;
         padding: 10px;
         object-fit: contain;
      }

         padding: 4px 15px 4px 4px;
         background-color: #2a4427;
         border-top-right-radius: 25px;
         display: flex;
         border-bottom-right-radius: 25px;
         font-weight: 600;
         color: white;
         align-items: center;
      }

         margin-right: 10px;
         border-radius: 50%;
         height: 50px;
         width: 50px;
         border: 1px solid;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         font-size: 37px;
         color: #fff;
         /* background-color: gainsboro;;; */
      }
