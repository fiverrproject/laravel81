         box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
      }

      .logo {
         width: 100%;
         text-align: center;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 10px;
         object-fit: contain;
      }

      .footer {
         width: 100%;
         position: absolute;
         /* background: rgba(245, 245, 245, 0.603); */
         bottom: 1rem;
         font-size: 40px;
      }

      .mb-1 {
         margin-bottom: 1rem;
      }

      .address {
         margin-top: 2rem;
         text-align: center;
         font-size: 45px;
         color: rgb(255, 255, 255);
      }

      .right-side {
         color: rgb(255, 255, 255);
      }
   </style>
</head>
