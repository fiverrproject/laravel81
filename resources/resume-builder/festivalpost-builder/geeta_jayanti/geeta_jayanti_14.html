         text-align: left;

         width: 290px;
         height: 290px;
         height: auto;
         object-fit: contain;
      }

         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: #00224F;
      }

         margin-right: 8px;
         padding: 4px;
         color: #00224F;
         text-shadow: 0px 0px 20px white;
      }

      footer {
         width: 100%;
         position: absolute;
         bottom: 5rem;
         font-size: 2.5rem;
         font-family: system-ui;
         color: #00224F;
         text-shadow: 0px 0px 20px white;

<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}

         {{else}}

            <h2 class="name">
