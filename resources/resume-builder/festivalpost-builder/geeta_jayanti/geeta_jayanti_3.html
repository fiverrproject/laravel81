         text-align: end;
         padding: 54px 54px 0 0;
      }

      .logo img {
         width: 290px;
         height: 290px;
         height: auto;
         object-fit: contain;
      }

      .name {
         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: #383838;
         text-align: center;
      }

      .svg-icon {
         margin-right: 8px;
         padding: 4px;
         /* color: #7f3200; */
      }

      footer {
         width: 100%;
         position: absolute;
         bottom: 4rem;
         font-size: 2.5rem;

         {{/if}}
