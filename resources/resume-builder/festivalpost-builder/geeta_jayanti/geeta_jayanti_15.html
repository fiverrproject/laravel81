      .logo {
            width: 100%;
            text-align: center;
        }

        .logo img {
            margin: auto;
            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

      .name {
         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: rgb(32, 32, 32);
         text-align: center;
      }

      .svg-icon {
         margin-right: 8px;
         padding: 4px;
         color: rgb(32, 32, 32);
         text-shadow: 0px 0px 20px white;
      }

      footer {
         width: 100%;
         position: absolute;
         bottom: 4rem;
         font-size: 2.5rem;
         font-family: system-ui;
         color: rgb(32, 32, 32);
         text-shadow: 0px 0px 20px white;
      }

<body>

      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <div>
            <h2 class="name">
               {{name}}
            </h2>
         </div>
         {{/if}}

      </div>
