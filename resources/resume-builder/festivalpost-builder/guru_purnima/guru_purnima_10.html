      .logo {
         /* width: 100%; */
         text-align: center;
         padding: 54px 0 0 0;
      }

      .logo img {
         width: 290px;
         height: auto;
         object-fit: contain;
      }

         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: black;
         /* text-shadow: 0px 0px 20px #ffffff; */
      }

      .svg-icon {
         margin-right: 8px;
         padding: 4px;
         color: black;
      }

      footer {
         width: 100%;
         position: absolute;
         bottom: 2rem;
         font-size: 2.5rem;
         font-family: system-ui;
         color: black;
