         width: 290px;
         height: auto;
         object-fit: contain;
      }

         padding-top: 35px;
         font-size: 3rem;

         color: black;

         margin-right: 8px;
         padding: 4px;
         color: black;
      }

         width: 100%;
         position: absolute;
         bottom: 2rem;

      </div>
