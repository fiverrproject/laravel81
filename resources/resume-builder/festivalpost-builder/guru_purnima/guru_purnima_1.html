         text-align: center;
         padding: 54px 0 0 0;
      }

         width: 290px;
         height: auto;
         object-fit: contain;
      }

         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: #282525;
         text-shadow: 0px 0px 20px #ffffff;
         text-align: center;
      }

         margin-right: 8px;
         padding: 4px;
         color: #c95000;
      }

      footer {
         width: 100%;
         position: absolute;
         bottom: 2rem;
         font-size: 2.5rem;
