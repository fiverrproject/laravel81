         width: 100%;

         height: 40px;
         width: 40px;
         color: goldenrod;

         justify-content: center;
         align-items: center;
         border-right: 2px solid goldenrod;
      }

         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid goldenrod;
         border-top: transparent;
         border-bottom: transparent;
      }
