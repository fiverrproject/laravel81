         width: 260px;
         height: 260px;
         padding: 10px;
         object-fit: contain;
      }

         margin: 0px;
         font-family: 'Playball', cursive;
         font-size: 26rem;
         font-weight: 100;
         background: linear-gradient(180deg, #bd1600, #ffffff);
         -webkit-text-fill-color: transparent;
         -webkit-background-clip: text;
         -webkit-text-stroke: 2px #6c5654;
      }

      .bye_bye_year_text {
         margin: 0px;
         font-size: 13rem;
         font-family: 'Playball', cursive;
         background: linear-gradient(13deg, #bd1600, #ffffff);
         -webkit-text-fill-color: transparent;
         -webkit-background-clip: text;
         -webkit-text-stroke: 0.5px #000000;
         position: absolute;
         right: 45px;
         bottom: 1px;
      }

      .titel {
         background: linear-gradient(180deg, #bd1600, #ffffff);
         -webkit-text-fill-color:#bd1600;
         -webkit-background-clip: text;
         -webkit-text-stroke: 0.5px #000000;
         margin: 0px;
         padding: 15px;
         font-size: 45px;
      }

      .contact {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 10px 0px;
         justify-content: center;
         align-items: center;
         background: #b1b1b1;
      }

      .contact li {
         margin: 0px 10px;
         color: #000000;
         display: flex;
         align-items: center;
         font-size: 45px;
      }

      .footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
      }
   </style>
</head>
