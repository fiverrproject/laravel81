      .logo {
         text-align: center;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 30px;
         object-fit: contain;
      }

      .bye_bye_year_text {
         font-size: 11rem;
         font-family: 'Dancing Script', cursive;
         background: linear-gradient(#c19133, #eed671, #c19133, #eed671);
         -webkit-text-fill-color: transparent;
         -webkit-background-clip: text;
         margin: 0;
      }

      .welcome_year_text {
         font-size: 17rem;
         font-family: 'Dancing Script', cursive;
         background: linear-gradient(#c19133, #eed671, #c19133, #eed671);
         -webkit-text-fill-color: transparent;
         -webkit-background-clip: text;
         margin: 0;
      }

      .title {
         padding-left: 15px;
         padding-top: 15px;
         color: #eac479;
         font-size: 50px;
         text-align: center;
      }

      .contact {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 10px;
         justify-content: center;
         background: #c19133;
         border-radius: 10px;
         align-items: center;
      }

      .contact li {
         margin: 0px 10px;
         color: #fff;
         display: flex;
         align-items: center;
         font-size: 32px;
      }



      .footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         background-color: rgba(222, 188, 55, 0.994);
         /* background-color: #191a1de8; */
      }

      .svgicon {
         margin-right: 12px;
         color: black;
         background-color: white;
         padding: 8px;
         border-radius: 50%;
      }
   </style>
</head>
