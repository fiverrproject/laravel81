         list-style: none;
         margin: 0;
         padding: 10px;
         justify-content: center;
         align-items: center;
         color: white;
      }

      .contact li {
         margin: 0px 10px;
         color: #000000;
         display: flex;
         align-items: center;
      }

      .footer {
         position: absolute;
         bottom: 30px;
         width: 100%;
         font-size: 3rem;
      }
