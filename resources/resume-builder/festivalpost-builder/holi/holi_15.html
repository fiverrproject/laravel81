      .logo {
         width: 100%;
      }

         margin: auto;
         width: 260px;
         height: 260px;
         /* padding: 30px; */
         object-fit: contain;
      }

         bottom: 0px;
         width: 100%;

         color: #000000;
      }

         color: rgb(255, 255, 255);
         background-color: #000000a7;
         padding: 8px;
         border-radius: 50%;

         margin-right: 8px;
         border-radius: 50%;

         height: 40px;
         width: 40px;
         color: white;

         justify-content: center;
         align-items: center;

         list-style: none;
         margin: 0;
         padding: 0;
      }

         width: 50px;
         height: 50px;
         box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
         border-radius: 8px;
         background: white;
         display: flex;
         justify-content: center;
         align-items: center;
         margin-right: 8px;
      }

         color: #1877f2;
      }

      .insta svg path {
         color: #e95950;
      }

      .x svg path {
         color: #00acee;
      }

      .in svg path {
         color: #0077b5;
      }
