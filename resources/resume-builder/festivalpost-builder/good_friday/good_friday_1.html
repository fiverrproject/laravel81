      }

         height: 290px;
         height: auto;
         object-fit: contain;
      }

         margin: 0px 0 0 52px;
         padding-top: 35px;
         font-size: 3rem;
         font-family: system-ui;
         color: rgb(32, 32, 32);
         text-align: center;
      }

      .svg-icon {
         margin-right: 8px;
         padding: 4px;
         color: rgb(32, 32, 32);
         text-shadow: 0px 0px 20px white;
      }

      footer {
         width: 100%;
         position: absolute;
         font-size: 2rem;
         font-family: system-ui;
         bottom: 4rem;
         color: rgb(32, 32, 32);

<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <div>
            <h2 class="name">
               {{name}}
            </h2>
         </div>
         {{/if}}

         <footer>

            {{#if email}}

                     class="bi bi-envelope-fill" viewBox="0 0 16 16">

            {{/if}}

               {{#if phone}}

                           class="bi bi-telephone-fill" viewBox="0 0 16 16">
                           <path fill-rule="evenodd"

                        </svg>
                     </div>
                     <div>{{phone}}</div>

               </div>
               {{/if}}

                        class="bi bi-globe2" viewBox="0 0 16 16">
                        <path

                  </div>

                     {{website}}
                  </div>
               </div>
               {{/if}}
            </div>

         </footer>
      </div>
   </div>
