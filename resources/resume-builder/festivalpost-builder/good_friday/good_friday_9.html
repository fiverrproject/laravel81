            height: 290px;
            height: auto;
            object-fit: contain;

            font-size: 3rem;

            color: #5A3930;

            padding: 4px;
            color: #5A3930;
        }

            width: 100%;
            position: absolute;
            bottom: 4rem;
            font-size: 2.5rem;

            {{/if}}
