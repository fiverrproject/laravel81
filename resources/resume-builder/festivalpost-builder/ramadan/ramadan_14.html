      .logo {
         width: 100%;
         text-align: center;
      }

         width: 290px;
         height: 200px;
         padding-top: 2.5rem; 
      }

      footer {
         position: absolute;
         bottom: 10px;
         width: 100%;
         font-size: 38px;
         color: #fff;
      }

      .svg-icon {
         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: #fff;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid #fff;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid #fff;
         border-top: transparent;
         border-bottom: transparent;
      }
   </style>
</head>

<body>
   <div class="container">
      <div class="bg">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 44px; text-align: center; color: #fff; padding-top: 2.5rem; ">
               {{name}}

            {{/if}}
