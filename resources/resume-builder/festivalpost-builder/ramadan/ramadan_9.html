      .logo {
         width: 100%;
         text-align: start;
      }

         width: 290px;
         height: 200px;
         padding-top: 2.5rem; 
         padding-left: 6rem
      }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 38px;
         color: #fff;
      }

      .svg-icon {
         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: white;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid white;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid rgb(226, 181, 228);
         /* border-top: transparent;
         border-bottom: transparent; */
      }

<body>
   <div class="container">
      <div class="bg">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 44px; text-align: start; color: #fff; padding-top: 2.5rem; padding-left: 6rem">
               {{name}}

            {{/if}}
