      .logo {
         width: 100%;
         text-align: center;
      }

      .logo img {
         width: 290px;
         height: 200px;
         padding-top: 3rem;
      }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 38px;
         color: #000;
         background: #d8d4d48a;
      }

      .svg-icon {
         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: black;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid black;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid black;
         border-top: transparent;
         border-bottom: transparent;
      }
   </style>
</head>

<body>
   <div class="container">
      <div class="bg">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 44px; text-align: center; color: #000; padding-top: 3rem;">
               {{name}}
            </h2>
            {{/if}}

               {{/if}}

                           class="bi bi-telephone-fill" viewBox="0 0 16 16">
