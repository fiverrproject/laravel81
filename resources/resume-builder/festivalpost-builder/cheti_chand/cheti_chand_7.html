         background-size: 100% 100%;
         height: 100vh;
      }

      .logo {
         text-align: center;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 30px;
         object-fit: contain;
      }

      .footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         background-color: rgba(152, 152, 152, 0.42);
         color:#005493;
      }

      .svgicon {
         margin-right: 12px;
         color: #005493;
         background-color: white;
         padding: 8px;
         border-radius: 50%;
      }
   </style>
</head>

<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <h2 style="text-align: center; color: #005493; margin: 0px;font-size: 3rem;padding: 30px 0 0 30px;">
            {{name}}
         </h2>
         {{/if}}

         <div class="footer">

               <div style="display: flex;justify-content: center;align-items: center;">

                     class="bi bi-telephone-fill svgicon" viewBox="0 0 16 16">

                  </svg>
                  <span>
                     {{phone}}
                  </span>
               </div>
               {{/if}}
               {{#if website}}

                  <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor"
                     class="bi bi-globe2 svgicon" viewBox="0 0 16 16">
                     <path

                  </svg>
                  <span>
                     {{website}}
                  </span>
               </div>
               {{/if}}
            </div>
         </div>
      </div>
   </div>
</body>

</html>
