      .logo {
         width: 100%;
      }

         width: 250px;
         height: 215px;
         margin-top: 15px;
         margin-left: 15px;
      }

      .logo {
         width: 290px;
         height: 200px;
         text-align: center;
      }

         width: 100%;
         object-fit: contain;
      }

         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 38px;
      }

         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: rgb(104, 8, 8);
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid rgb(104, 8, 8);
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid rgb(104, 8, 8);
         border-top: transparent;
         border-bottom: transparent;
      }

<body>
   <div class="container">
      <div class="bg">
         <div style="display: flex; justify-content: space-between; align-items: start; padding: 35px;">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 44px; text-align: center;">
               {{name}}
            </h2>
            {{/if}}
