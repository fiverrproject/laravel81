   <div class="container">
      <div class="bg">

            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 44px; text-align: center; color: #fff;">
               {{name}}

            {{/if}}
