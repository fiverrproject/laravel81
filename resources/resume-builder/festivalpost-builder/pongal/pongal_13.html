      .logo {
         width: 100%;
      }

         width: 250px;
         height: 215px;
         margin-top: 15px;
         margin-left: 15px;
      }

      .logo {
         width: 290px;
         height: 200px;
         text-align: center;
      }

      .logo img {
         width: 100%;
         object-fit: contain;
      }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 38px;
         color: #fff;
      }

      .svg-icon {
         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: white;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid white;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid white;
         border-top: transparent;
         border-bottom: transparent;
      }

<body>
   <div class="container">
      <div class="bg">
         <div style="display: flex; justify-content: space-between; align-items: start; padding: 35px;">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 44px; text-align: center; color: #fff;">
               {{name}}
            </h2>
            {{/if}}
         </div>

         <footer>
            <div
               style="display: flex; flex-direction: column; gap:25px; justify-content: center; padding: 30px; align-items: center;">
               {{#if email}}

                  <div class="svg-icon">
                     <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                        class="bi bi-envelope-fill" viewBox="0 0 16 16">
                        <path

                  </div>
                  <div>
                     {{email}}
                  </div>
               </div>
               {{/if}}

                           class="bi bi-telephone-fill" viewBox="0 0 16 16">

                     <div>{{phone}}</div>

                  {{/if}}
