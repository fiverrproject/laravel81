         width: 100%;
         text-align: end;
      }

         height: 215px;
         padding-top: 25px;
         padding-right: 25px;

      }

         background-color: #fcfeff;
         border-top-right-radius: 25px;

         align-items: center;

         color: rgb(0, 0, 0);
         display: flex;
         justify-content: center;
         align-items: center;

         margin-right: 10px;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      } 

      .footer {
         position: absolute;
         bottom: 15px;
         width: 100%;
         font-size: 37px;
      }
