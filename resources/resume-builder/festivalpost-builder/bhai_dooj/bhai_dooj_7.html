          margin: auto;
          width: 260px;
          height: 260px;
          padding: 10px;
          object-fit: contain;
      }

      .footer {
          position: absolute;
          bottom: 22px;
          width: 100%;
          background: linear-gradient(153deg, rgb(234, 195, 42) 34%, rgb(242, 137, 0) 54%)
          /* background-color: #191a1de8; */
      }

      .svgicon {
          margin-right: 12px;
          color: black;
          background-color: white;
          padding: 10px;
          border-radius: 50%;
      }
  </style>
</head>

<body>
  <div class="container">
      <div class="bg">
          {{#if companyLogo}}
          <div class="logo">
              <img src="{{companyLogo}}" alt="Brand logo">
          </div>

          <h2 style="text-align: center;color: black;margin: 0px;font-size: 3rem;padding: 30px 0 0 30px;">

                      </svg>
                      <span>
                          {{phone}}

                      </svg>
                      <span>
                          {{website}}

                  </div>

              </div>
          </div>
      </div>
  </div>
</body>

</html>
