      .logo {
         width: 150px;
      }

      .logo img {
         width: 250px;
         height: 215px;
         object-fit: contain;
      }

         width: 100%;
         position: absolute;
         bottom: 0px;
         font-size: 38px;
      }

         display: flex;
         justify-content: center;
         align-items: center;
         color: #fff;
         padding: 7px;
      }

         padding: 4px 4px 4px 15px;
         background-color: #089ba5;
         border-top-left-radius: 25px;
         display: flex;
         border-bottom-left-radius: 25px;
         font-weight: 600;

<body>
   <div class="container bg">
      <div style="display: flex; align-items: start; justify-content: space-between; padding: 15px 0px 0px 15px;">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">

         {{else}}
         <h2 style="color: #089ba5; margin: 0px; font-size: 45px;">
            {{name}}

         {{/if}}

         {{#if phone}}

      </div>


      <div class="footer">

            style="display: flex; gap: 25px; justify-content: center; align-items: center; background: #089ba5;">
            {{#if website}}

               <span
                  style="color: #089ba5; width: 35px; height: 35px; border-radius: 50%; background: #fff; display: flex; justify-content: center; align-items: center; margin-right: 5px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-globe"

                  </svg>
               </span>
               <span>{{website}}</span>
            </div>
            {{/if}}

            {{#if email}}
            <div class="coros_contact">
               <span
                  style="color: #089ba5; width: 35px; height: 35px; border-radius: 50%; background: #fff; display: flex; justify-content: center; align-items: center; margin-right: 5px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                     class="bi bi-envelope-at-fill" viewBox="0 0 16 16">

                  </svg>
               </span>
               <span>{{email}}</span>
            </div>
            {{/if}}
         </div>
         {{#if address}}
         <p style="color: #089ba5; margin: 7px; text-align: center; font-size: 37px;">
            {{address}}
         </p>
         {{/if}}
      </div>
   </div>
</body>

</html>
