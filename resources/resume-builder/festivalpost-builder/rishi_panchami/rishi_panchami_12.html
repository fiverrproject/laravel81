      .numberdata {
         padding: 4px 15px 4px 4px;
         background-color: #EEC870;
         border-top-right-radius: 25px;
         display: flex;
         border-bottom-right-radius: 25px;
         font-weight: 600;
         color: black;
         align-items: center;
      }

      .svg-icon {
         margin-right: 10px;
         color: black;
         display: flex;
         justify-content: center;
         align-items: center;
      } 

      .footer {
         position: absolute;
         bottom: 15px;
         width: 100%;
         font-size: 37px;
      }
   </style>
</head>
