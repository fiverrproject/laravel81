      .logo {
         width: 290px;
         height: 200px;
         text-align: center;
      }

      .logo img {
         width: 100%;
         object-fit: contain;
      }

      footer {
         position: absolute;
         bottom: 0px;
         width: 100%;
         font-size: 38px;
         color: #000;
      }

      .svg-icon {
         margin-right: 8px;
         height: 40px;
         width: 40px;
         color: BLACK;
         display: flex;
         justify-content: center;
         align-items: center;
         border-right: 2px solid BLACK;
      }

      .social {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 0;
      }

      .bg-icon {
         display: inline-block;
         padding: 10px 20px;
         border-radius: 50px;
         text-decoration: none;
         border: 1px solid BLACK;
         border-top: transparent;
         border-bottom: transparent;

<body>
   <div class="container">
      <div class="bg">
         <div style="display: flex; justify-content: space-between; align-items: start; padding: 35px;">
            {{#if companyLogo}}
            <div class="logo">
               <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="margin: 0px; font-size: 44px; text-align: center; color: #000;">
               {{name}}
            </h2>
            {{/if}}
         </div>

         <footer>
            <div
               style="display: flex; flex-direction: column; gap:25px; justify-content: center; padding: 30px; align-items: center;">
               {{#if email}}
               <div style="display: flex;align-items: center; margin: 0 10px;" class="bg-icon">
                  <div class="svg-icon">
                     <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                        class="bi bi-envelope-fill" viewBox="0 0 16 16">
                        <path
                           d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z" />
                     </svg>
                  </div>
                  <div>
                     {{email}}
                  </div>
               </div>
               {{/if}}

                  {{#if phone}}

                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                           class="bi bi-telephone-fill" viewBox="0 0 16 16">
                           <path fill-rule="evenodd"

                        </svg>
                     </div>
                     <div>{{phone}}</div>
                  </div>
                  {{/if}}

                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                           class="bi bi-globe2" viewBox="0 0 16 16">

                     </div>
                     <div>
                        {{website}}
                     </div>
                  </div>
                  {{/if}}
               </div>
            </div>
         </footer>
      </div>
   </div>
</body>
