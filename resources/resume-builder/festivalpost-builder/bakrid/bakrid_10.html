            padding-left: 15px;
        }

            bottom: 15px;
            width: 100%;

            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;

<body>
    <div class="container">
        <div class="bg">
            {{#if companyLogo}}
            <div class="logo_text">
                <img src="{{companyLogo}}" alt="Brand logo">
            </div>
            {{else}}
            <h2 style="text-align: center; color: #fff; margin: 0px;font-size: 50px; padding: 10px;">
                {{name}}
            </h2>
            {{/if}}

            <div class="footer">
                <div style="display: flex; justify-content: center; align-items: center;">
                    <ul class="contact">
                        {{#if email}}
