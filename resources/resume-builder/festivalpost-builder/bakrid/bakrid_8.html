        .logo

        }

            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

            position: absolute;
            bottom: 10px;
            width: 100%;
        }

            list-style: none;
            margin: 0;
            padding: 10px;
        }

            align-items: center;
