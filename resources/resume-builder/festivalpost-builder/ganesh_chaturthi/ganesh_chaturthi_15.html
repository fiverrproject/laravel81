         font-size: 3rem;
         font-family: system-ui;
         color: #383838;
         text-align: center;

         padding: 4px;

         position: absolute;

<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">

         {{else}}
         <div>
            <h2 class="name">
               {{name}}

         {{/if}}
