         font-size: 3rem;
         font-family: system-ui;
         color: #383838;
         text-align: center;
      }

      footer {
         position: absolute;
         bottom: 5rem;
         width: 100%;
         color: #2b2b2b;
         font-size: 40px;
         display: flex;
         justify-content: center;
         font-family: system-ui;
      }

      .svg-icon {
         margin-right: 8px;
         padding: 6px;
      }
   </style>
</head>

<body>

                        class="bi bi-envelope-fill" viewBox="0 0 16 16">

                     </svg>
                  </div>
                  <div>
                     {{website}}
                  </div>
               </div>
               {{/if}}

               {{#if address}}
               <div style="display: flex; text-wrap: nowrap;">
                  <div class="svg-icon">

         </footer>

      </div>
   </div>
</body>


</html>
