         width: 100%;
         position: absolute;
         bottom: 0px;
         font-size: 40px;
         padding: 5px;
         background:#e7d1a0
      }

      .second-line {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 10px;
         justify-content: center;
         align-items: center;
      }

      .d-flex {
         margin: 0px 10px;
         display: flex;
         align-items: center;
         justify-content: center;
      }

      .website {
         text-align: center;
      }
   </style>
</head>
