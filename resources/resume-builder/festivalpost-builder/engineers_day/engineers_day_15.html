         bottom: 0;
         width: 100%;

<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <h2 style="text-align: center;color: rgb(0, 0, 0);margin: 0px;font-size: 3rem;padding: 30px 0 0 30px;">

                  class="bi bi-telephone-fill svgicon" viewBox="0 0 16 16">
