      }

      .logo {
         width: 150px;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 30px;
         margin: 0;
         object-fit: contain;
      }

      .footer {
         width: 100%;
         position: absolute;
         bottom: 0px;
      }

      .coros_contact {
         display: flex;
         justify-content: center;
         align-items: center;
         background: #1fb6de;
         color: #000000;
         font-size: 40px;
         padding: 7px;
      }

      .numberdata {
         padding: 4px 4px 4px 15px;
         background-color: #1fb6de;
         border-top-left-radius: 25px;
         display: flex;
         border-bottom-left-radius: 25px;
         font-weight: 600;
         color: #000000;
         align-items: center;
         margin-top: 10px;
      }
   </style>
</head>

<body>
   <div class="container bg">
      <div style="display: flex; align-items: start; justify-content: space-between; padding: 15px 0px 0px 15px;">
         {{#if companyLogo}}
