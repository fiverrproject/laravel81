         height: 100vh;
         position: relative;
         box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
      }

      .logo {
         width: 100%;
         text-align: start;
      }

      .logo img {
         margin: auto;
         width: 260px;
         height: 260px;
         padding: 10px;
         object-fit: contain;
      }

      .footer {
         width: 100%;
         position: absolute;
         /* background: rgba(245, 245, 245, 0.603); */
         bottom: 15px;
         font-size: 40px;
      }

      .mb-1 {
         margin-bottom: 1rem;
      }

      .address {
         margin-top: 1rem;
         text-align: center;
         font-size: 38px;
         color: black;
      }

      .right-side {
         color: black;
      }
   </style>
</head>
