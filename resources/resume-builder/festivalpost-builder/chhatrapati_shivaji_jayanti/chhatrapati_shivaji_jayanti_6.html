         border-radius: 50%;
         color: rgb(255, 255, 255);
         display: flex;
         justify-content: center;
         align-items: center;
      }

      .footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         font-size: 37px;
         color: #fff;
         /* background-color: gainsboro;;; */
      }

</head>
