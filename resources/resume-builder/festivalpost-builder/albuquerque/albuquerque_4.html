      .logo {
            width: 100%;
            text-align: start;
            margin: 0%;
            padding: 0;
        }

        .logo img {
            margin: auto;
            width: 260px;
            height: 260px;
            padding: 10px;
            object-fit: contain;
        }

         position: absolute;
         bottom: 0px;
         width: 100%;
         background-color: #ffffffdb;
         font-size: 40px;

         justify-content: center;

         list-style: none;
         margin: 0;
         padding: 0;
      }

         width: 50px;
         height: 50px;

         background: white;
         display: flex;
         justify-content: center;
         align-items: center;
         margin-right: 8px;
      }

      .fb svg path {
         color: #1877f2;
      }

      .insta svg path {
         color: #e95950;
      }

      .x svg path {
         color: #00acee;
      }

      .in svg path {
         color: #0077b5;
      }
