      .logo {
         width: 100%;
         text-align: center;
      }

         width: 250px;
         height: 215px;
         margin-top: 15px;
         margin-right: 15px;
      }

      .contact {
         display: flex;
         list-style: none;
         margin: 0;
         padding: 20px;
         justify-content: center;
      }

      .contact li {
         padding: 0px 10px;
         border-right: 1px solid #6d0125;
         color: #6d0125;
         font-size: 32px;
      }

      .footer {
         position: absolute;
         bottom: 0;
         width: 100%;
         background: linear-gradient(153deg, rgb(160, 48, 0) 34%, rgb(81, 22, 3) 54%);
         color: white;
      }

      .svgicon {
         margin-right: 12px;
         color: black;
         background-color: white;
         padding: 8px;
         border-radius: 50%;
      }

<body>
   <div class="container">
      <div class="bg">
         {{#if companyLogo}}
         <div class="logo">
            <img src="{{companyLogo}}" alt="Brand logo">
         </div>
         {{else}}
         <h2 style="text-align: center;color: rgb(10, 24, 71);margin: 0px;font-size: 3rem;padding: 30px 0 0 30px;">
            {{name}}

         {{/if}}

                     class="bi bi-telephone-fill svgicon" viewBox="0 0 16 16">
