      background-size: cover;
      background-position: center;
      height: 100vh;
    }

    .display-section {
      font-size: 2.2rem;
      font-style: italic;
      font-family: cursive;
      font-weight: 700;
      position: absolute;
      top: 72%;
      left: 50%;
      transform:translate(-50%, -50%);
      width:100%;
    }

    .uppercase {
      text-transform: uppercase;
    }

    .baby-shower {
      font-size: 2.2rem;
      font-style: italic;
      font-family: cursive;
      padding-top: 1.5rem;
    }


    .name {
      font-size: 3rem;
      font-weight: 900;
      padding-bottom: 2rem;
    }

    .date {
      display: inline;
      margin-top: 3rem;
      font-size: 1.4rem;
    }

    .time {
      font-size: 1.4rem;
    }

    .address {
      font-size: 1.4rem;
      text-transform: uppercase;
      margin-top: 2rem;
      padding: 0 10rem;
    }

    .invitee {
      font-size: 1.8rem;
      padding-top: 1.5rem;
    }

    .baby-feet {
      border-radius: 50%;
      width: 200px;
      height: 200px;
    }

    .hexagon {
      width: 130px;
      height: 100px;
      background: #dde4e9;
      position: relative;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: black;
    }

    .hexagon:before,
    .hexagon:after {
      content: '';
      position: absolute;
      width: 0;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
    }

    .hexagon:before {
      top: -29px;
      border-bottom: 29px solid #afcde2;
    }

    .hexagon:after {
      bottom: -29px;
      border-top: 29px solid #afcde2;
    }

    .content_table {
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0;
      font-size: 1.2rem;
    }

    h1,
    h3 {
      margin: 0;
    }

    .emoji {
      font-size: 1.5em;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>
  <div class="container bg">
    <div class="display-section">

      {{#if mother_name}}
      <div class="name">
        {{mother_name}}
      </div>
      {{/if}}

      <div class="content_table">
        {{#if date}}
        <div class="hexagon text">
          <div class="emoji">📅</div>
          <h3>{{date}}</h3>
        </div>
        {{/if}}

        {{#if time}}
        <div class="hexagon text">
          <div class="emoji">⌚</div>
          <h3>{{time}}</h3>
        </div>
        {{/if}}
      </div>

      {{#if address1}}
      <div class="address">
        {{address1}}
      </div>
      {{/if}}

      {{#if invitee}}
      <div class="invitee">
        <div>Hosted by</div>
        <div> {{invitee}}</div>
        {{#if contact_no}}<div>Please RSVP to {{contact_no}}</div>{{/if}}
      </div>
      {{/if}}
    </div>
  </div>
</body>

</html>
