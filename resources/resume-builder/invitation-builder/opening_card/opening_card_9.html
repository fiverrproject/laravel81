   <div class="container">
      <div class="bg">

         {{#if address1}} 
         <div class="footer">
            <div class="address">{{address1}}</div> 
         </div>
         {{/if}}

               {{well_wisher}}
            </div>
         </div>
         {{/if}}

      </div>
   </div>
