<body>
    <div class="container">
        <div class="bg">
            <div class="timer">
                {{#if time}} <p class="time" style="color: #ff8e40;padding-left: 5px;">{{time}}</p> {{/if}}
                {{#if date}} <p class="date" style="padding-left: 5px;color: #000;padding-top: 30px;">{{date}}</p>
                {{/if}}
            </div>

            {{#if well_wisher}}
            <div class="well_wisher">
                <p style="font-weight: bold;text-align: end;margin: 0;">Your Well Wisher</p>
                <p style="text-align: end;margin: 0;">
                    {{well_wisher}}
                </p>
            </div>
            {{/if}}

            <footer>
                {{#if address1}}
                <div style="display: flex; justify-content: end; padding: 3px;">
                    <p class="address" style="background-color: #ff8e40;padding: 5px;">
                        {{address1}}
                    </p>
                </div>
                {{/if}}
            </footer>
        </div>
    </div>
</body>

</html>
