<body>
    <div class="container">
        <div class="bg">
            <div class="timer">
                {{#if date}} <div class="date">{{date}}</div> {{/if}}
                {{#if time}} <div class="time" style="margin-top: 5px;">{{time}}</div> {{/if}}
            </div>

            {{#if well_wisher}}
            <div class="well_wisher">
                <p style="font-weight: bold;text-align: end;margin: 0;">Your Well Wisher</p>
                <p style="text-align: end;margin: 0;">
                    {{well_wisher}}
                </p>
            </div>
            {{/if}}

            <footer>
                {{#if address1}}
                <div style="text-align: center; padding: 3px;font-weight: 700;">
                    <div class="address">
                        {{address1}}
                    </div>
                </div>
                {{/if}}
            </footer>
        </div>
    </div>
</body>

</html>
