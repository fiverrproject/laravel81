            bottom: 18%;

            font-family: system-ui;
            font-weight: 100;
            display: flex;
        }

            font-weight: 100;
        }

            position: absolute;
            right: 6%;
            top: 4%;
            font-size: 30px;
        }

        footer {
            position: absolute;
            right: 35%;
            bottom: 12%;
            width: 100%;
            width: 450px;

            font-family: system-ui;
            font-weight: 100;

<body>
    <div class="container">
        <div class="bg">
            <div class="timer">
                {{#if time}} <p class="time">{{time}} |</p> {{/if}}
                {{#if date}} <p class="date" style="padding-left: 5px;"> {{date}}</p> {{/if}}
            </div>

            {{#if well_wisher}}
            <div class="well_wisher">
                <p style="font-weight: bold;text-align: end;margin: 0;">Your Well Wisher</p>
                <p style="text-align: end;margin: 0;">
                    {{well_wisher}}
                </p>
            </div>
            {{/if}}

            <footer>
                {{#if address1}}
                <div>
                    <p class="address" style="text-align: center;font-weight: 100;">
                        {{address1}}
                    </p>
                </div>
                {{/if}}
            </footer>
        </div>
    </div>
</body>

</html>
