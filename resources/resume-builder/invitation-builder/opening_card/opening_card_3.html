<body>
    <div class="container">
        <div class="bg">
            <div class="timer">
                <div style="display: flex; justify-content: center; padding: 3px;">
                    {{#if time}} <p class="time">{{time}} ,</p> {{/if}}
                    {{#if date}} <p class="date" style="padding-left: 5px;">{{date}}</p> {{/if}}
                </div>
            </div>

            {{#if well_wisher}}
            <div class="well_wisher">
                <p style="font-weight: bold;text-align: end;margin: 0;">Your Well Wisher</p>
                <p style="text-align: end;margin: 0;">
                    {{well_wisher}}
                </p>
            </div>
            {{/if}}

            <footer>
                {{#if address1}}
                <div style="text-align: center; padding: 5px;">
                    <p class="address">
                        {{address1}}
                    </p>
                </div>
                {{/if}}
            </footer>
        </div>
    </div>
</body>
