  <title>Days To Go 10</title>

  <style>
    body {
      margin: 0px;
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    .img1 {
      width: 100%;
      height: 100vh;
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
      object-fit: cover;
    }

    .img2 {

      width: 100%;
      position: absolute;
      left: 0px;
      bottom: 0px;
      z-index: -1;
    }

    .day {
      position: absolute;
      bottom: 7%;
      width: 100%;
      text-align: center;
      color: rgb(30 27 54);
      font-size: 200px;
      font-family: 'Nova Square', sans-serif !important;
    }


    .date {
      color: white;
      font-size: 30px;
      position: absolute;
      bottom: 21.5rem;
      left: 0px;
      width: 100%;
      text-align: center;
      font-family: 'Nova Square', sans-serif !important;
    }

    .d-flex {
      display: flex;
    }

    .name {
      position: absolute;
      top: 1%;
      right: 0px;
      width: 45%;
      text-align: center;
      color: rgb(184 0 0);
      font-size: 57px;
      font-family: 'Nova Square', sans-serif !important;
      padding: 5px;
      font-weight: 700;
    }

    p {
      margin: 0px;
      text-align: center;
    }
