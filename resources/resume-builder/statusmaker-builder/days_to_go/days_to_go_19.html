  <title>Days To Go 7</title>

  <style>
    body {
      margin: 0px;
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    .couple-img {
      width: 100%;
      height: 100%;
      /* position: absolute; */
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    .box {
      position: absolute;
      width: 100%;
      bottom: 4rem;
      display: flex;
      justify-content: center;
      align-items: baseline;
      font-family: 'Comforter', cursive;
      color: #1a3b5a;
    }

    .count {
      font-family: 'Comforter', cursive;
      font-size: 9rem;
    }

    .days {
      font-family: 'Comforter', cursive;
      font-size: 3rem;
      margin: 0;

    }

    .to-go {
      font-family: 'Comforter', cursive;
      font-size: 3rem;
      margin-left: 10px;

    }


    .couple-name {
      color: #1a3b5a;
      font-family: 'Comforter', cursive;
      position: absolute;
      bottom: 13rem;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      text-transform: capitalize;
      letter-spacing: 2px;
    }

    .date {
      color: #1a3b5a;
      font-family: 'Comforter', cursive;
      position: absolute;
      bottom: 3rem;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      text-transform: capitalize;
      letter-spacing: 2px;
    }

    .save-the-date {
      top: 30rem;
      position: absolute;
      width: 100%;
      text-align: center;
    }

    .save-the-date img {
      width: 23rem;
      height: auto;
    }
  </style>
</head>
