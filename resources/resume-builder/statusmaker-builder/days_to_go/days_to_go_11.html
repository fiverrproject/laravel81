  <style>
    body {
      margin: 0px;
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    .img1 {
      width: 100%;
      height: 100vh;
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
      object-fit: cover;
    }

    .img2 {

      width: 100%;
      position: absolute;
      left: 0px;
      bottom: 0px;
      z-index: -1;
    }

    .day {
      position: absolute;
      bottom: 8%;
      width: 40%;
      text-align: center;
      color: rgb(194 0 0);
      font-size: 200px;
      font-family: 'Satisfy', sans-serif;
    }

      position: absolute;

      width: 35%;

    .d-flex {
      display: flex;
    }

    .name {
      position: absolute;
      top: 3%;
      right: 0px;
      width: 100%;
      text-align: center;
