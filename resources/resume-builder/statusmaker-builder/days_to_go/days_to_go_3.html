<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,100;0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;0,9..40,1000;1,9..40,100;1,9..40,200;1,9..40,300;1,9..40,400;1,9..40,500;1,9..40,600;1,9..40,700;1,9..40,800;1,9..40,900;1,9..40,1000&family=Dancing+Script:wght@500;600;700&family=Gabarito:wght@400;500;600;700;800;900&family=Heebo:wght@900&family=Jost:wght@600;700;800;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nova+Square&family=Oswald:wght@200;300;400;500;600;700&family=Vina+Sans&display=swap"
    rel="stylesheet">
  <title>Days To Go 3</title>
  <style>
    body {
      margin: 0px;
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    img {
      width: 100%;
      height: 100vh;
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
    }

    .day {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #ffffff;
      font-size: 400px;
      font-family: 'Vina Sans', sans-serif;
    }

    .text {

      font-size: 50px;
      color: rgb(255, 255, 255);
      position: absolute;
      bottom: 140px;
      padding: 0px 80px;
      font-weight: 700;
      background-color: #4caf50;
      font-family: 'Albert Sans', sans-serif;
      letter-spacing: 10px;

    }

    .text2 {
      position: absolute;
      bottom: 74px;
      margin-left: 30px;
      color: rgb(255, 255, 255);
      text-align: center;
      width: 50%;
      font-size: 50px;
      font-weight: 700;
      font-family: 'Albert Sans', sans-serif;
    }

    .date {
      font-family: 'Albert Sans', sans-serif;
      padding: 0px 30px;
    }

    .name {
      padding: 0px 30px;
      font-size: 40px;
      font-family: 'Dancing Script', cursive;
    }

    .footer {
      width: 100%;
      position: absolute;
      bottom: 0px;
      color: rgb(0, 0, 0);
      font-size: 30px;
      font-weight: 600;
      background-color: #ffffff;
      padding: 0px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .d-flex {

      display: flex;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <div>
        <img src="{{image}}" alt="Brand logo">
      </div>
      <div class="d-flex">
        <div style="width: 35%;">
          <div class="day">{{day_count}}</div>
        </div>
        <div style="width: 65%;">
          <div class="text">DAYS TO GO</div>
          {{#if title}}<div class="text2">{{title}}</div>{{/if}}
        </div>
      </div>
      <div class="footer">
        {{#if date}}<div class="date">{{date}}</div>{{/if}}
        {{#if boy_name}}<div class="name">{{boy_name}} {{#if girls_name}} <span>& {{girls_name}}</span>{{/if}} </div>{{/if}}
      </div>
    </div>
  </div>
</body>

</html>
