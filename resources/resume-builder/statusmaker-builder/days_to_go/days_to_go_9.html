  <style>
    body {
      margin: 0px;
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    .img1 {
      width: 100%;
      height: 100vh;
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
      object-fit: cover;
    }

    .img2 {

      width: 58%;
      position: absolute;
      left: 0px;
      bottom: 0px;
    }

    .day {
      position: absolute;
      bottom: 18%;
      width: 16%;
      left: 14%;
      text-align: center;
      color: rgb(184 0 0);
      font-size: 156px;
      font-family: 'Dancing Script', sans-serif;
      z-index: 1;
    }

    .date {
      color: rgb(184 0 0);
      font-size: 25px;
      position: absolute;
      bottom: 8%;
      left: 15px;
      width: 23%;
      text-align: center;
      font-family: 'Dancing Script', sans-serif;
    }

    .d-flex {
      display: flex;
    }

    .name {
      position: absolute;
      bottom: 5%;
      right: 0px;
      width: 45%;
      text-align: center;
      color: rgb(184 0 0);
      font-size: 57px;
      font-family: 'Dancing Script', sans-serif;
      padding: 5px;
      font-weight: 700;
    }

    p {
      margin: 0px;
      text-align: center;
