  <title>Days To Go 13</title>

  <style>
    body {
      margin: 0px;
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    .img1 {
      width: 100%;
      height: 100vh;
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
    }

    .img2 {

      width: 100%;
      position: absolute;
      left: 0px;
      bottom: 0px;
      z-index: -1;
    }

    .day {
      position: absolute;
      bottom: 0;
      width: 30%;
      text-align: center;
      color: rgb(255 151 44);
      font-size: 240px;
      font-family: 'Bebas Neue', sans-serif;
    }

    .text2 {
      position: absolute;
      top: 10%;
      left: 0px;
      color: rgb(255 151 44);
      font-size: 50px;
      font-family: 'Bebas Neue', sans-serif;
      padding: 5px 5px 5px 50px;
      letter-spacing: 3px;
    }

    .date {
      color: rgb(255 151 44);
      font-size: 45px;
      position: absolute;
      bottom: 20px;
      left: 35%;
      font-family: 'Bebas Neue', sans-serif;
    }

    .d-flex {
      display: flex;
    }

    .name {
      position: absolute;
      top: 1%;
      right: 0px;
      width: 45%;
      text-align: center;
      color: rgb(255 151 44);
      font-size: 57px;
      font-family: 'Bebas Neue', sans-serif;
      padding: 5px;
      font-weight: 700;
    }

    p {
      margin: 0px;
      text-align: center;
    }
  </style>
</head>

            <p>&</p>

          {{/if}}

          <div class="day">{{day_count}}</div>
