<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Grape+Nuts&display=swap" rel="stylesheet">
   <title>Days To Go 1</title>

   <style>
      body {
         margin: 0px;
         font-family: 'Grape Nuts', cursive;
      }

      .container {
         height: 100vh;
         max-width: 1000px;
         margin: auto;
         position: relative;
      }

      .couple-img {
         width: 100%;
         height: 100%;
         /* position: absolute; */
         background-repeat: no-repeat;
         background-size: cover;
         background-position: center;
         z-index: -1;
      }

      .box {
         position: absolute;
         top: 6rem;
         right: 7rem;
         display: flex;
         align-items: baseline;
      }

      .count {
         font-size: 15rem;
         margin: 0;
      }

      .days {
         font-size: 6rem;
         margin: 0;

      }

      .to-go {
         font-size: 3rem;

      }

      .couple-name {
         position: absolute;
         top: 21rem;
         right: 7rem;
         /* width: 50%; */
         font-size: 2rem;
         text-align: center;
         /* background-color: aliceblue; */
      }

      .date {
         font-size: 1.5rem;
         position: absolute;
         top: 14rem;
         right: 7rem;
      }
   </style>
</head>

<body>
   <div class="container">

      <div class="couple-img" style="background-image: url({{image}});"></div>

      <div class="date">
         {{date}}
      </div>

      <div class="box">
         <div>
            <h1 class="count">{{day_count}}</h1>
         </div>
         <div>
            <h1 class="days">Days</h1>
         </div>
         <div>
            <p class="to-go">to go</p>
         </div>
      </div>

      <div class="couple-name">
         <!-- Arhoon & Rashmika -->
         {{boy_name}} & {{girls_name}}
      </div>

</body>

</html>
