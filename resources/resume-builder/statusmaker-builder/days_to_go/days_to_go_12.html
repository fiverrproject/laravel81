  <title>Days To Go 12</title>

  <style>
    body {
      margin: 0px;
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    .img1 {
      width: 100%;
      height: 100vh;
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
      object-fit: cover;
    }

    .img2 {

      width: 100%;
      position: absolute;
      left: 0px;
      bottom: 0px;
      z-index: -1;
    }

    .day {
      position: absolute;
      bottom: 0;
      width: 30%;
      text-align: center;
      color: rgb(241 193 0);
      font-size: 240px;
      font-family: 'Bebas Neue', sans-serif;
    }

    .text2 {
      position: absolute;
      top: 10%;
      left: 0px;
      color: rgb(241 193 0);
      font-size: 50px;
      font-family: 'Bebas Neue', sans-serif;
      padding: 5px 5px 5px 50px;
      letter-spacing: 3px;
    }

    .date {
      color: rgb(184 0 0);
      font-size: 35px;
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
    }

    .d-flex {
      display: flex;
    }

    .name {
      position: absolute;
      top: 1%;
      right: 0px;
      width: 45%;
      text-align: center;
      color: rgb(241 193 0);
      font-size: 57px;
      font-family: 'Bebas Neue', sans-serif;
      padding: 5px;
      font-weight: 700;
    }

    p {
      margin: 0px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <div>
        <img src="{{image}}" class="img1" alt="Brand logo">

        <div>
          <!-- {{#if title}} <div class="text2">{{title}}</div>{{/if}} -->
          {{#if boy_name}}
          <div class="name">
            <p>{{boy_name}}</p>
            <p>&</p>
            <p>{{girls_name}}</p>
          </div>
          {{/if}}
          <div class="day">{{day_count}}</div>

          <div class="date">
            <p>
              {{date}}
            </p>
          </div>
