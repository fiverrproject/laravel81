<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;800&family=Grape+Nuts&display=swap"
    rel="stylesheet">
  <title>Days To Go 3</title>

  <style>
    body {
      margin: 0px;
      font-family: 'Cinzel', serif;
      /* font-family: 'Grape Nuts', cursive; */
    }

    .container {
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      position: relative;
    }

    .couple-img {
      width: 100%;
      height: 100%;
      /* position: absolute; */
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    .box {
    /* background-color: aliceblue; */
    position: absolute;
    top: 6rem;
    right: 7rem;
    /* width: 43rem; */
}

    .count {
      font-size: 14rem;
      margin: 0;
    }

    .days {
      text-align: center;
      font-size: 7rem;
      margin: 0 0 -60px 0;
    }

    .to-go {
      font-size: 6rem;
      margin: -60px 0 0 0;
    }

    .couple-name {
    margin-top: -4.7rem;
    font-size: 1.5rem;
    text-align: left;
    /* background-color: aliceblue; */
}

.date {
    font-size: 1.5rem;
    text-align: end;
    margin-bottom: -5rem;
}
  </style>
</head>

<body>
  <div class="container">

    <div class="couple-img" style="background-image: url({{image}});"></div>
    <div class="box">
      <div class="date">
        {{date}}
      </div>

      <div style="display: flex; align-items: center;justify-content: center;">
        <div>
          <h1 class="count">{{day_count}}</h1>
        </div>
        <div>
          <h1 class="days">Days</h1>
          <div>
            <p class="to-go">to go</p>
          </div>
        </div>
      </div>

      <div class="couple-name">
        <!-- Arhoon & Rashmika -->
        {{boy_name}} & {{girls_name}}
      </div>
    </div>
  </div>
</body>

</html>
