<body>
   <div class="container">
      <div class="bg">

         {{#if image}}
         <div>
            <img src="{{image}}" />
         </div>
         {{/if}}

         {{#if boy_name}}
         <div class="name">
            {{boy_name}}
         </div>
         {{/if}}

         <div
            style="display: flex;justify-content: center;align-items: center;width: 100%;position: absolute;top: 52rem;">
            {{#if day_count}} <div class="count"> {{day_count}} </div> {{/if}}
            <div>
               {{#if year_or_month}} <div class="month">{{year_or_month}}</div> {{/if}}

            </div>
         </div>

      </div>
   </div>
</body>
