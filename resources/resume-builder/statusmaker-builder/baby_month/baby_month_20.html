<body>
   <div class="container">
      <div class="bg">
         {{#if image}}
         <div>
            <img src="{{image}}" />

         {{/if}}

         {{#if year_or_month}}
         <div class="month">
            {{year_or_month}} Complate
         </div>
         {{/if}}


         {{#if day_count}}
         <div class="count">
            {{day_count}}
         </div>
         {{/if}}


         {{#if boy_name}}
         <div class="name">
            {{boy_name}}
         </div>
         {{/if}}

      </div>
   </div>
</body>
