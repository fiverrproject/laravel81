      }

      }

         width: 100%;

      }

         width: 100%;

      }

<body>
   <div class="container">
      <div class="bg">
         {{#if image}}
         <div>
            <img src="{{image}}" />
         </div>
         {{/if}}
         {{#if boy_name}}
         <div class="text">
            <span>{{boy_name}}</span>
         </div>
         {{/if}}

         {{#if day_count}}
         <div class="text-2">
            <span>{{day_count}}</span>
            {{#if year_or_month}}
            <span style="margin-left: 16px;">{{year_or_month}}</span>
            {{/if}}
         </div>
         {{/if}}

      </div>
   </div>
</body>
