    <div class="container">
        <div class="bg">

            {{#if boy_name}}
            <div class="text">
                <span>{{boy_name}} & </span>

            </div>
            {{/if}}

            {{#if image}}
            <img src='{{image}}'>
            {{/if}}

            {{#if title}}
            <div class="text-2">
                <div style="font-size: 60px;">Congratulations</div>
                <span style="margin-left: 100px;">{{title}}</span>
            </div>
            {{/if}}

            {{#if description}}
            <div class="text-3">
                <div>{{description}}</div>
            </div>
            {{/if}}

        </div>
    </div>
</body>
