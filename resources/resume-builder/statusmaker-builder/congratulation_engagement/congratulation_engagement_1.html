            left: 2rem;

            top: 7.5rem;
            left: 2rem;

        }

            top: 15em;
            left: 0rem;

            align-items: center;

            top: 37rem;
            left: 2rem;
            width: 40%;

<body>
    <div class="container">
        <div class="bg">
            <div class="myImg">
                <img src="{{image}}" alt="">
            </div>

            <div class="name">
                <div>
                    <p style="font-size:4rem;margin: 0;">{{boy_name}}</p>
                    <p style="font-size:1.8rem;">&</p>
                    <p style="font-size:4rem;margin: 0;">{{girls_name}}</p>
                </div>
            </div>

            <div class="cong">
                Congrartulations
            </div>

            {{#if title}}
            <div class="title">
                {{title}}
            </div>
            {{/if}}

            {{#if description}}
            <div class="description">
                {{description}}
            </div>
            {{/if}}

        </div>
    </div>
</body>

</html>
