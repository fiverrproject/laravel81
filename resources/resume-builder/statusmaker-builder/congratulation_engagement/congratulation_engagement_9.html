        }

        }

            top: 2rem;
            width: 100%;

            top: 8rem;
            width: 100%;

<body>
    <div class="container">
        <div class="bg">

            <div class="myImg">{{#if image}}
                <img src="{{image}}"> {{/if}}
            </div>

            <div class="cong">
                <h1>Congratulations</h1>
            </div>
            <div class="title">
                <p>{{title}}</p>
            </div>

            <div class="name">
                <div>
                    <p style="font-size:4rem;margin: 0;">{{boy_name}}</p>
                    <p style="font-size:1.8rem;">&</p>
                    <p style="font-size:4rem;margin: 0;">{{girls_name}}</p>
                </div>
            </div>

            <div class="description">
                {{description}}
            </div>
</body>

</html>
