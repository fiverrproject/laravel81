<body>
    <div class="container">
        <div class="bg">

            {{#if image}}
            <img src="{{image}}">
            {{/if}}

            {{#if boy_name}}
            <div class="text">
                <span>{{boy_name}} & </span>
                <span> {{girls_name}}</span>
            </div>
            {{/if}}

            {{#if title}}

                <div style="font-size: 70px;">Congratulations</div>
                <span style="margin-left: 100px;">{{title}}</span>
            </div>
            {{/if}}

            {{#if description}}

                <div>{{description}}</div>
            </div>
            {{/if}}
        </div>
    </div>
