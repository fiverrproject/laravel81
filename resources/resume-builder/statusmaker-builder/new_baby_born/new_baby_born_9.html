            position: absolute;
            z-index: -1;
            left: 117px;
            top: 291px;
            /* rotate: 352deg; */
        }

        .baby-img img {
            width: 331px;
            height: 425px;
            object-fit: cover;
        }

        .parent-img {
            position: absolute;
            right: 119px;
            z-index: -1;
            top: 270px;
            /* rotate: 7deg; */
        }

        .parent-img img {
            width: 318px;
            height: 420px;
            object-fit: cover;
        }

        .gender {
            position: absolute;
            top: 16rem;
            left: 13rem;
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-family: 'Diphylleia', serif;
            color: #ffffff;
            /* rotate: 352deg; */
        }

        .details-box {
            width: 100%;
            color: #1dbed0;
            position: absolute;
            top: 55rem;
            font-size: 2rem;
            text-align: center;
            font-family: 'Diphylleia', serif;
            display: flex;
            justify-content: space-evenly;
        }

        .details-box p {
            margin: 5px 0;
        }

        .parent-name-box {
            color: white;
            position: absolute;
            top: 42.2rem;
            right: 9rem;
            font-size: 2rem;
            text-align: center;
            font-family: 'Diphylleia', serif;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="container bg">

        <div class="baby-img">
            <img src="{{baby_img}}" alt="">
        </div>

        <div class="parent-img">
            <img src="{{parent_img}}" alt="">
        </div>

        {{#if gender}}
        <div class="gender">
            <p>Its a {{gender}}</p>
        </div>
        {{/if}}

        <div class="details-box">
          {{#if date}}  <p> <strong>Date :</strong> {{date}} </p> {{/if}}
          {{#if time}}  <p> <strong>Time :</strong> {{time}} </p> {{/if}}
          {{#if weight}}  <p> <strong>Weight :</strong> {{weight}} </p> {{/if}}
        </div>

        <div class="parent-name-box">
            <p>{{father_name}} &</p>
            <p>{{mother_name}}</p>
        </div>

    </div>
</body>

</html>
