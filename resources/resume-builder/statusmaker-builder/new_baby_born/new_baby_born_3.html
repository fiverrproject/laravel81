         height: 100vh;
         width: 100%;
      }

      .baby-img {
         position: absolute;
         z-index: -1;
         left: 114px;
         top: 150px;
         rotate: 354deg;
      }

      .baby-img img {
         width: 348px;
         height: 345px;
         object-fit: cover;
      }

      .parent-img {
         position: absolute;
         left: 489px;
         z-index: -1;
         rotate: 9deg;
         top: 345px;
      }

      .parent-img img {
         width: 324px;
         height: 365px;
         object-fit: cover;
      }

      .gender {
         position: absolute;
         top: 31.5rem;
         left: 14rem;
         font-size: 3rem;
         letter-spacing: 2px;
         rotate: 353deg;
         font-family: 'Diphylleia', serif;
      }

      .details-box {
         position: absolute;
         top: 42rem;
         left: -2rem;
         width: 27rem;
         font-size: 1.3rem;
         text-align: center;
         font-family: system-ui;
      }

      .details-box p {
         margin: 17px 0;
         color: white;
      }

      .parent-name-box {
         position: absolute;
         top: 44.5rem;
         left: 25rem;
         width: 26rem;
         font-size: 1.6rem;
         text-align: center;
         rotate: 8deg;
         font-family: system-ui;
      }
   </style>
</head>

<body>
   <div class="container bg">

      <div class="baby-img">
         <img src="{{baby_img}}" alt="">
      </div>

      <div class="parent-img">
         <img src="{{parent_img}}" alt="">
      </div>
      {{#if gender}}
      <div class="gender">
         <p>Its a {{gender}}</p>
      </div>
      {{/if}}

      <div class="details-box">
        {{#if date}} <p> <strong>Date :</strong> {{date}} </p>{{/if}}
        {{#if time}} <p> <strong>Time :</strong> {{time}} </p>{{/if}}
        {{#if weight}} <p> <strong>Weight :</strong> {{weight}} </p>{{/if}}
      </div>

      <div class="parent-name-box">
         <p>{{father_name}} & </p>
         <p>{{mother_name}}</p>
      </div>

   </div>
</body>

</html>
