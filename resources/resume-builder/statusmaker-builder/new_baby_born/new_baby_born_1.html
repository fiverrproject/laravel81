      .baby-img {
         position: absolute;
         width: 394px;
         height: 394px;
         left: 4.1rem;
         top: 15rem;
      }

      img {
         width: 100%;
         height: 100%;
         object-fit: cover;
      }

      .parent-img {
         position: absolute;
         width: 400px;
         height: 457px;
         left: 33.5rem;
         top: 11.3rem;
      }

      .gender {
         position: absolute;
         top: 11rem;
         left: 4rem;
         font-size: 2rem;
         letter-spacing: 2px;
      }

      .details-box {
         position: absolute;
         top: 40.1rem;
         left: 4rem;
         width: 25rem;
         font-size: 1.3rem;
         text-align: center;
         font-family: system-ui;
      }

      .details-box p {
         margin: 17px 0;
      }

      .parent-name-box {
         position: absolute;
         top: 41rem;
         left: 34rem;
         width: 25rem;
         font-size: 1.6rem;
         text-align: center;
         font-family: system-ui;
      }

      .heading {
         text-align: center;
         font-size: 3rem;
         font-family: system-ui;
         padding-top: 2rem;
         font-weight: 100;
      }
   </style>
</head>

<body>
   <div class="container bg">

      <div class="heading">
         <p>"We've added to the family."</p>
      </div>

      <div class="baby-img">
         <img src="{{baby_img}}" alt="">
      </div>

      <div class="parent-img">
         <img src="{{parent_img}}" alt="">
      </div>

      {{#if gender}}
      <div class="gender">
         <p>Its a {{gender}}</p>
      </div>
      {{/if}}
      
      <div class="details-box">
         {{#if date}} <p> <strong>Date :</strong> {{date}} </p> {{/if}}
         {{#if time}} <p> <strong>Time :</strong> {{time}} </p> {{/if}}
         {{#if weight}} <p> <strong>Weight :</strong> {{weight}} </p> {{/if}}
      </div>

      <div class="parent-name-box">
         <p>{{father_name}}</p>
         <p>&</p>
         <p>{{mother_name}}</p>
      </div>

   </div>
</body>

</html>
