            height: 100vh;
            width: 100%;

        .baby-img {
            position: absolute;
            z-index: -1;
            left: 0;
            top: 0;
            /* rotate: 357deg; */
        }

        .baby-img img {
            width: 760px;
            height: 760px;
            object-fit: cover;
        }

        .parent-img {
            position: absolute;
            right: 73px;
            z-index: -1;
            top: 475px;
            /* rotate: 11deg; */
        }

        .parent-img img {
            width: 394px;
            height: 375px;
            object-fit: cover;
        }

        .gender {
            position: absolute;
            top: 5rem;
            left: 51rem;
            font-size: 3rem;
            letter-spacing: 2px;
            font-family: 'Diphylleia', serif;
            color: #336b7a;
        }

        .details-box {
            left: 8rem;
            color: #336b7a;
            position: absolute;
            top: 46rem;
            font-size: 2rem;
            text-align: center;
        }

        .details-box {
            left: 6rem;
            color: #336b7a;
            position: absolute;
            top: 51rem;
            font-size: 2rem;
            text-align: start;
        }

        .details-box p {
            display: flex;
            align-items: center;
        }

        .details-box p svg {
            margin-right: 1.5rem;
        }

        .parent-name-box {
            color: #336b7a;
            position: absolute;
            top: 53.3rem;
            right: 1rem;
            width: 50%;
            font-size: 2rem;
            text-align: center;
            font-family: 'Diphylleia', serif;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="container bg">

        <div class="baby-img">
            <img src="{{baby_img}}" alt="">
        </div>

        <div class="parent-img">
            <img src="{{parent_img}}" alt="">
        </div>

        {{#if gender}}
        <div class="gender">
            <p>Its a <br><span style="font-size: 4rem;"> {{gender}}</span></p>
        </div>
        {{/if}}

        <div class="details-box">
            {{#if date}} <p><svg width="2rem" height="2rem" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M19 2H18V0H16V2H8V0H6V2H5C3.9 2 3 2.9 3 4V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V4C21 2.9 20.1 2 19 2ZM19 20H5V8H19V20ZM19 6H5V4H19V6Z"
                        fill="#336b7a" />
                </svg>{{date}} </p> {{/if}}

            {{#if time}} <p><svg width="2rem" height="2rem" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#336b7a" stroke-width="2" fill="none" />
                    <line x1="12" y1="12" x2="16" y2="12" stroke="#336b7a" stroke-width="2" />
                    <line x1="12" y1="12" x2="12" y2="8" stroke="#336b7a" stroke-width="2" />
                </svg>
                {{time}} </p> {{/if}}
                
            {{#if weight}} <p><svg width="2rem" height="2rem" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="4" height="14" rx="2" ry="2" fill="#336b7a" />
                    <rect x="15" y="5" width="4" height="14" rx="2" ry="2" fill="#336b7a" />
                    <rect x="9" y="9" width="6" height="6" rx="3" ry="3" fill="#336b7a" />
                </svg> {{weight}} </p> {{/if}}
        </div>

        <div class="parent-name-box">
            <p>{{father_name}} &</p>
            <p>{{mother_name}}</p>
        </div>

    </div>
</body>

</html>
