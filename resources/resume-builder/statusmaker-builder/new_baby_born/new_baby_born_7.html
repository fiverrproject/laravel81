         width: 100%;
      }

      .baby-img {
         position: absolute;
         z-index: -1;
         left: 165px;
         top: 66px;
         rotate: 357deg;
      }

      .baby-img img {
         width: 374px;
         height: 540px;
         object-fit: cover;
      }

      .parent-img {
         position: absolute;
         right: 82px;
         z-index: -1;
         top: 402px;
         rotate: 3deg;
      }

      .parent-img img {
         width: 331px;
         height: 460px;
         object-fit: cover;
      }

      .gender {
         position: absolute;
         top: 38.5rem;
         left: 17rem;
         font-size: 2.5rem;
         letter-spacing: 2px;
         font-family: 'Diphylleia', serif;
         color: #4a555d;
         rotate: 351deg;
      }

      .details-box {
         color: #ffffff;
         position: absolute;
         top: 47rem;
         left: 15rem;
         font-size: 1.5rem;
         text-align: center;
         font-family: 'Diphylleia', serif;
      }

      .details-box p {
         margin: 5px 0;
      }

      .parent-name-box {
         color: #4a555d;
         position: absolute;
         top: 16rem;
         right: 5rem;
         font-size: 2rem;
         text-align: center;
         font-family: 'Diphylleia', serif;
         margin: auto;
      }
   </style>
</head>

<body>
   <div class="container bg">

      <div class="baby-img">
         <img src="{{baby_img}}" alt="">
      </div>

      <div class="parent-img">
         <img src="{{parent_img}}" alt="">
      </div>

      {{#if gender}}
      <div class="gender">
         <p>Its a {{gender}}</p>
      </div>
      {{/if}}

      <div class="details-box">
        {{#if date}} <p> <strong>Date :</strong> {{date}} </p> {{/if}}
        {{#if time}} <p> <strong>Time :</strong> {{time}} </p> {{/if}}
        {{#if weight}} <p> <strong>Weight :</strong> {{weight}} </p> {{/if}}
      </div>

      <div class="parent-name-box">
         <p>{{father_name}}</p>
         <p>&</p>
         <p>{{mother_name}}</p>
      </div>

   </div>
</body>

</html>
