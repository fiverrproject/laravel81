        .baby-img {
            position: absolute;
            z-index: -1;
            left: 155px;
            top: 507px;
            /* rotate: 352deg; */
        }

        .baby-img img {
            width: 370px;
            height: 355px;
            object-fit: cover;
        }

        .parent-img {
            position: absolute;
            right: 113px;
            z-index: -1;
            top: 113px;
            /* rotate: 7deg; */
        }

        .parent-img img {
            width: 247px;
            height: 338px;
            object-fit: cover;
        }

        .gender {
            position: absolute;
            top: 55rem;
            left: 6rem;
            font-size: 2.8rem;
            letter-spacing: 2px;
            font-family: 'Diphylleia', serif;
            color: #336b7a;
            /* rotate: 352deg; */
        }

        .details-box {
            width: 100%;
            color: #336b7a;
            position: absolute;
            top: 19rem;
            font-size: 2rem;
            left: 18rem;
        }

        .details-box p {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .details-box p svg {
            margin-right: 1.3rem;
        }


        .parent-name-box {
            color: #336b7a;
            position: absolute;
            top: 31rem;
            right: 9rem;
            font-size: 2rem;
            text-align: center;
            font-family: 'Diphylleia', serif;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="container bg">

        <div class="baby-img">
            <img src="{{baby_img}}" alt="">
        </div>

        <div class="parent-img">
            <img src="{{parent_img}}" alt="">
        </div>

        {{#if gender}}
        <div class="gender">
            <p>Its a {{gender}}</p>
        </div>
        {{/if}}

        <div class="details-box">
            {{#if date}} <p><svg width="2rem" height="2rem" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M19 2H18V0H16V2H8V0H6V2H5C3.9 2 3 2.9 3 4V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V4C21 2.9 20.1 2 19 2ZM19 20H5V8H19V20ZM19 6H5V4H19V6Z"
                        fill="#336b7a" />
                </svg>{{date}} </p> {{/if}}

            {{#if time}} <p><svg width="2rem" height="2rem" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#336b7a" stroke-width="2" fill="none" />
                    <line x1="12" y1="12" x2="16" y2="12" stroke="#336b7a" stroke-width="2" />
                    <line x1="12" y1="12" x2="12" y2="8" stroke="#336b7a" stroke-width="2" />
                </svg>
                {{time}} </p> {{/if}}
                
            {{#if weight}} <p><svg width="2rem" height="2rem" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="4" height="14" rx="2" ry="2" fill="#336b7a" />
                    <rect x="15" y="5" width="4" height="14" rx="2" ry="2" fill="#336b7a" />
                    <rect x="9" y="9" width="6" height="6" rx="3" ry="3" fill="#336b7a" />
                </svg> {{weight}} </p> {{/if}}
        </div>

        <div class="parent-name-box">
            <p>{{father_name}} &</p>
            <p>{{mother_name}}</p>
        </div>

    </div>
</body>


</html>
