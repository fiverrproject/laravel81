         height: 100vh;
         width: 100%;
      }

      .baby-img {
         position: absolute;
         z-index: -1;
         right: 80px;
         top: 160px;
         rotate: 351deg;
      }

      .baby-img img {
         width: 416px;
         height: 510px;
         object-fit: cover;
      }

      .parent-img {
         position: absolute;
         left: 53px;
         z-index: -1;
         top: 91px;
      }

      .parent-img img {
         width: 410px;
         height: 500px;
         object-fit: cover;
      }

      .gender {
         position: absolute;
         top: 48rem;
         left: 42.4rem;
         font-size: 3rem;
         letter-spacing: 2px;
         font-family: 'Diphylleia', serif;
         color: #ed6666;
         ;
         rotate: 351deg;
      }

      .details-box {
         color: #ed6666;
         position: absolute;
         top: 47rem;
         left: 8rem;
         font-size: 2rem;
         text-align: center;
         font-family: 'Diphylleia', serif;
      }

      .details-box p {
         margin: 17px 0;
      }

      .parent-name-box {
         color: #ed6666;
         position: absolute;
         top: 38rem;
         left: 8rem;
         font-size: 1.8rem;
         text-align: center;
         font-family: 'Diphylleia', serif;
         margin: auto;
      }
   </style>
</head>

<body>
   <div class="container bg">

      <div class="baby-img">
         <img src="{{baby_img}}" alt="">
      </div>

      <div class="parent-img">
         <img src="{{parent_img}}" alt="">
      </div>

      {{#if gender}}
      <div class="gender">
         <p>Its a {{gender}}</p>
      </div>
      {{/if}}

      <div class="details-box">
        {{#if date}} <p> <strong>Date :</strong> {{date}} </p> {{/if}}
        {{#if time}} <p> <strong>Time :</strong> {{time}} </p> {{/if}}
        {{#if weight}} <p> <strong>Weight :</strong> {{weight}} </p> {{/if}}
      </div>

      <div class="parent-name-box">
         <p>{{father_name}}</p>
         <p>&</p>
         <p>{{mother_name}}</p>
      </div>

   </div>
</body>


</html>
