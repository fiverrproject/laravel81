      .baby-img {
         position: absolute;
         z-index: -1;
         left: -55px;
         top: 288px;
         rotate: 335deg;
      }

      .baby-img img {
         width: 488px;
         height: 660px;
         object-fit: cover;

      }

      .parent-img {
         position: absolute;
         right: -2px;
         z-index: -1;
         top: -2px;
      }

      .parent-img img {
         width: 440px;
         height: 635px;
         object-fit: cover;
      }

      .gender {
         position: absolute;
         top: 54.5rem;
         left: 10.3rem;
         font-size: 3rem;
         letter-spacing: 2px;
         rotate: 353deg;
         font-family: 'Diphylleia', serif;
      }

      .details-box {
         position: absolute;
         top: 45rem;
         left: 27rem;
         width: 27rem;
         font-size: 1.9rem;
         text-align: center;
         font-family: system-ui;
      }

      .details-box p {
         margin: 17px 0;
      }

      .parent-name-box {
         position: absolute;
         top: 10.5rem;
         left: -1rem;
         width: 26rem;
         font-size: 2rem;
         text-align: center;
         font-family: system-ui;
      }
   </style>
</head>

<body>
   <div class="container bg">

      <div class="baby-img">
         <img src="{{baby_img}}" alt="">
      </div>

      <div class="parent-img">
         <img src="{{parent_img}}" alt="">
      </div>
      
      {{#if gender}}
      <div class="gender">
         <p>Its a {{gender}}</p>
      </div>
      {{/if}}

      <div class="details-box">
         {{#if date}} <p> <strong>Date :</strong> {{date}} </p> {{/if}}
         {{#if time}} <p> <strong>Time :</strong> {{time}} </p> {{/if}}
         {{#if weight}} <p> <strong>Weight :</strong> {{weight}} </p> {{/if}}
      </div>

      <div class="parent-name-box">
         <p>{{father_name}} & </p>
         <p>{{mother_name}}</p>
      </div>

   </div>
</body>

</html>
