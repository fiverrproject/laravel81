         width: 100%;
      }

      .baby-img {
         position: absolute;
         width: 384px;
         height: 400px;
         left: 5rem;
         top: 13rem;
         rotate: 343deg;
      }

      img {
         width: 100%;
         height: 100%;
         object-fit: cover;
      }

      .parent-img {
         position: absolute;
         width: 420px;
         height: 420px;
         left: 34.5rem;
         z-index: -1;
         rotate: 18deg;
         top: 17.3rem;
      }

      .gender {
         position: absolute;
         top: 39rem;
         left: 15rem;
         font-size: 3rem;
         letter-spacing: 2px;
         rotate: 345deg;
         font-family: 'Diphylleia', serif;
      }

      .details-box {
         position: absolute;
         top: 52rem;
         left: 10rem;
         width: 25rem;
         font-size: 1.3rem;
         text-align: center;
         font-family: system-ui;
      }

      .details-box p {
         margin: 17px 0;
      }

      .parent-name-box {
         position: absolute;
         top: 44rem;
         left: 30rem;
         width: 25rem;
         font-size: 1.6rem;
         text-align: center;
         rotate: 16deg;
         font-family: system-ui;
      }
   </style>
</head>

<body>
   <div class="container bg">

      <div class="baby-img">
         <img src="{{baby_img}}" alt="">
      </div>

      <div class="parent-img">
         <img src="{{parent_img}}" alt="">
      </div>

      {{#if gender}}
      <div class="gender">
         <p>Its a {{gender}}</p>
      </div>
      {{/if}}
      
      <div class="details-box">
         <p> <strong>Born : </strong> {{#if date}} {{ date }} | {{/if}} {{#if time}} {{ time }} | {{/if}} {{#if weight}}
            {{ weight }} {{/if}}</p>
      </div>

      <div class="parent-name-box">
         <p>{{father_name}} & </p>
         <p>{{mother_name}}</p>
      </div>

   </div>
</body>

</html>
