        .baby-img {
            position: absolute;
            z-index: -1;
            left: 65px;
            top: 297px;
            rotate: 352deg;
        }

        .baby-img img {
            width: 366px;
            height: 379px;
            object-fit: cover;
        }

        .parent-img {
            position: absolute;
            right: 57px;
            z-index: -1;
            top: 345px;
            rotate: 7deg;
        }

        .parent-img img {
            width: 442px;
            height: 470px;
            object-fit: cover;
        }

        .gender {
            position: absolute;
            top: 16rem;
            left: 9rem;
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-family: 'Diphylleia', serif;
            color: #4a555d;
            rotate: 352deg;
        }

        .details-box {
            color: #7d739f;
            position: absolute;
            top: 45rem;
            left: 12rem;
            font-size: 1.5rem;
            text-align: center;
            font-family: 'Diphylleia', serif;
        }

        .details-box p {
            margin: 5px 0;
        }

        .parent-name-box {
            color: #4a555d;
            position: absolute;
            top: 11rem;
            right: 11rem;
            font-size: 2rem;
            text-align: center;
            font-family: 'Diphylleia', serif;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="container bg">

        <div class="baby-img">
            <img src="{{baby_img}}" alt="">
        </div>

        <div class="parent-img">
            <img src="{{parent_img}}" alt="">
        </div>

        {{#if gender}}
        <div class="gender">
            <p>Its a {{gender}}</p>
        </div>
        {{/if}}

        <div class="details-box">
           {{#if date}} <p> <strong>Date :</strong> {{date}} </p> {{/if}}
           {{#if time}} <p> <strong>Time :</strong> {{time}} </p> {{/if}}
           {{#if weight}} <p> <strong>Weight :</strong> {{weight}} </p> {{/if}}
        </div>

        <div class="parent-name-box">
            <p>{{father_name}}</p>
            <p>&</p>
            <p>{{mother_name}}</p>
        </div>

    </div>
</body>

</html>
