<body>
    <div class="container bg">
        {{#if boy_name}}
        <div class="boy_name">
            <h2>{{boy_name}}</h2>
        </div>
        {{/if}}

        {{#if image}}
        <div class="boy-image">
            <img src="{{image}}">
        </div>
        {{/if}}

        {{#if title}}
        <div class="title">
            "{{title}}"
        </div>
        {{/if}}
    </div>
</body>
