            height: 100%;
            position: relative;
        }

        .imgCard {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .imgCard img {
            object-fit: cover;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            border: 10px solid white;
            -webkit-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
            -moz-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
            box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
        }

        .box-container {
            position: absolute;
            left: 50%;
            transform: translatex(-50%);
            top: 65%;
            z-index: 999;
            font-size: 2rem;
        }

        .box {
            position: relative;
            display: inline-block;
            padding: 10px;
            background-color: #3498db;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            z-index: 2;
        }

        .decor-left,
        .decor-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50px;
            background-color: #2c3e50;
            z-index: 1;
        }

        .decor-left {
            left: -50px;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 50%);
        }

        .decor-right {
            right: -50px;
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%, 0% 0%);
        }

        .info {
            position: absolute;
            top: 74%;
            text-align: center;
            left: 0;
            right: 0;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #24567d;
            font-family: system-ui;
        }

        .description {
            font-size: 1.2rem;
            font-weight: 300;
            color: #24567d;
            font-family: system-ui;
            padding: 1rem 7rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bg">
            <div class="">
                {{#if boy_name}}
                <!-- <div>
                    <h2 class="studentName">{{boy_name}}</h2>
                </div> -->
                <div class="box-container">
                    <div class="decor-left"></div>
                    <div class="box">
                        {{boy_name}}
                    </div>
                    <div class="decor-right"></div>
                </div>
                {{/if}}

                {{#if image}}
                <div class="imgCard">
                    <img src="{{image}}" alt="">
                </div>
                {{/if}}

                <div class="info">
                    {{#if title}}
                    <div>
                        <h3 class="title">{{title}}</h3>
                    </div>
                    {{/if}}

                    {{#if description}}
                    <div class="description">
                        <p>{{description}}</p>
                    </div>
                    {{/if}}
                </div>
            </div>

        </div>
    </div>
</body>

</html>
