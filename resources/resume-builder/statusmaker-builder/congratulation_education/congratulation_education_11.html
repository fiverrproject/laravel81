<body>
    <div class="container">
        <div class="bg">
            <div class="" style="width: 100%;">
                <div style="width: 50%;">
                    {{#if boy_name}}
                    <div>
                        <h2 class="studentName">{{boy_name}}</h2>
                    </div>
                    {{/if}}
                    {{#if title}}
                    <div>
                        <h3 class="title">{{title}}</h3>
                    </div>
                    {{/if}}
                    {{#if description}}
                    <div class="description">
                        <p>{{description}}</p>
                    </div>
                    {{/if}}
                </div>
                <div style="width: 50%;">
                    {{#if image}}
                    <div class="imgCard">
                        <img src="{{image}}" alt="">
                    </div>
                    {{/if}}
                </div>
            </div>
        </div>


    </div>
</body>
