            position: absolute;

            color: black;
            font-family:cursive;

            left: 0;
            right: 0;
        }

            position: absolute;
            font-size: 1.9rem;

            left: 0;
            right: 0;

            position: absolute;
            font-size: 1.2rem;
            font-weight: 300;

            left: 0;

<body>
    <div class="container">
        <div class="bg">
            <div class="">
                {{#if boy_name}}
                <div>
                    <h2 class="studentName">{{boy_name}}</h2>
                </div>
                {{/if}}

                {{#if image}}
                <div class="imgCard">
                    <img src="{{image}}" alt="">
                </div>
                {{/if}}

                {{#if title}}
                <div>
                    <h3 class="title">{{title}}</h3>
                </div>
                {{/if}}

                {{#if description}}
                <div class="description">
                    <p>{{description}}</p>
                </div>
                {{/if}}

            </div>

        </div>


    </div>
</body>

</html>
