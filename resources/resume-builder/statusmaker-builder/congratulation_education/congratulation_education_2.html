            position: absolute;
            top: 38.5%;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .imgCard img {
            width: 400px;
            height: 400px;
            border: 10px solid white;
            border-radius: 50%;
            object-fit: cover;
        }

        .studentName {
            text-align: center;
            position: absolute;
            font-size: 2.5rem;
            font-weight: 500;
            font-family: system-ui;
            top: 32%;
            left: 0;
            right:0;
            text-align: center;
            color:#7e5446;
        }

        .info {
            position:absolute;
            bottom: 6%;
            left:0;
            right:0;
            text-align: center;
            width:100%;
            color:#7e5446;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: system-ui;
        }

        .description {
            font-size: 1.2rem;
            font-weight: 300;
            font-family: system-ui;
            padding: 1rem 7rem
        }
    </style>
</head>

<body>
    <div class="container bg">
        {{#if boy_name}}
        <div>
            <p class="studentName">{{boy_name}}</p>
        </div>
        {{/if}}

        {{#if image}}
        <div class="imgCard">
            <img src="{{image}}" alt="">
        </div>
        {{/if}}

        <div class="info">
            {{#if title}}
            <div>
                <h3 class="title">{{title}}</h3>
            </div>
            {{/if}}
    
            {{#if description}}
            <div class="description">
                <p>{{description}}</p>
            </div>
            {{/if}}
        </div>


    </div>
</body>

</html>
