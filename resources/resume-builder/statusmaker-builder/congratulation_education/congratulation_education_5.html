        .imgCard {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .box {
    width: 250px;
    height: 250px;
    background: black;
    position: absolute;
    top: 30.8%;
    left: 40%;
}

.imgCard img {
    object-fit: cover;
    width: 250px;
    height: 250px;
    border: 10px solid white;
    -webkit-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
    -moz-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
    box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
}

        .studentName {
            text-align: center;
            position: absolute;
            font-size: 2rem;
            color: rgb(32, 30, 30);
            font-family: system-ui;
            top: 23%;
            left: 0;
            right: 0;
        }

        .info {
            text-align: center;
            position: absolute;
            top: 63%;
            left: 0;
            right: 0;
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: rgb(32, 30, 30);
            font-family: system-ui;
        }

        .description {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 300;
            color: rgb(32, 30, 30);
            font-family: system-ui;
            padding:20px 7rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bg">
            {{#if boy_name}}
            <div>
                <h2 class="studentName">{{boy_name}}</h2>
            </div>
            {{/if}}

            <div class="box"></div>
            {{#if image}}
            <div class="imgCard">
                <img src="{{image}}" alt="">
            </div>
            {{/if}}

            <div class="info">
                {{#if title}}
                <div>
                    <h3 class="title">{{title}}</h3>
                </div>
                {{/if}}

                {{#if description}}
                <div class="description">
                    <p>{{description}}</p>
                </div>
                {{/if}}

            </div>
        </div>


    </div>
</body>

</html>
