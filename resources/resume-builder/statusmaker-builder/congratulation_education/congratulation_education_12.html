            position: absolute;
            top: 130px;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .imgCard img {
            object-fit: cover;
            width: 230px;
            height: 230px;
            border-top: 10px solid white;
            border-right: 10px solid white;
            border-bottom: 10px solid white;
            border-left: 10px solid white;
            -webkit-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
            -moz-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);

        }

            text-align: center;
            position: absolute;
            font-size: 2rem;
            color: #ff6c6c;
            font-family: system-ui;
            top: 40px;
            left: 0;
            right: 0;
        }

        .title {
            text-align: center;
            position: absolute;
            font-size: 2.4rem;
            font-weight: 700;
            color: #ff6c6c;
            font-family: system-ui;
            top: 390px;
            left: 0;
            right: 0;
        }

        .description {
            text-align: center;
            position: absolute;
            font-size: 1.4rem;
            font-weight: 300;
            color: #ff6c6c;
            font-family: system-ui;
            top: 450px;
            left: 0;
            right: 0;
            padding: 20px 7rem;
            margin-top: 20px;

            
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bg">
            <div class="">
                {{#if boy_name}}
                <div>
                    <h2 class="studentName">{{boy_name}}</h2>
                </div>
                {{/if}}

                {{#if image}}
                <div class="imgCard">
                    <img src="{{image}}" alt="">
                </div>
                {{/if}}

                {{#if title}}
                <div>
                    <h3 class="title">{{title}}</h3>
                </div>
                {{/if}}

                {{#if description}}
                <div class="description">
                    <p>{{description}}</p>
                </div>
                {{/if}}

            </div>

        </div>


    </div>
</body>

</html>
