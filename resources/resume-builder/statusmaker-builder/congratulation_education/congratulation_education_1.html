        .imgCard {
            position: absolute;
            top: 33%;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .imgCard img {
    object-fit: cover;
    width: 400px;
    height: 400px;
    border-radius: 20px;
    border-top: 10px solid white;
    border-right: 10px solid white;
    border-bottom: 10px solid white;
    border-left: 10px solid white;
    -webkit-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
    -moz-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
    box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
}

        .studentName {
            text-align: center;
            position: absolute;
            font-size: 2.4rem;
            color: #fac365;
            font-family: system-ui;
            top: 21%;
            left: 0;
            right: 0;
        }

        .info {
            position: absolute;
            top: 75%;
            left: 0;
            right: 0;
            text-align: center;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fac365;
            font-family: system-ui;
            bottom: 22%;
        }

        .description {
            font-size: 1.2rem;
            font-weight: 300;
            color: #fac365;
            font-family: system-ui;
            padding: 0rem 7rem;
        }
    </style>
</head>

<body>
    <div class="container bg">

        {{#if boy_name}}
        <div>
            <h2 class="studentName">{{boy_name}}</h2>
        </div>
        {{/if}}

        {{#if image}}
        <div class="imgCard">
            <img src="{{image}}" alt="">
        </div>
        {{/if}}


        <div class="info">
            {{#if title}}
            <div>
                <h3 class="title">{{title}}</h3>
            </div>
            {{/if}}

            {{#if description}}
            <div class="description">
                <p>{{description}}</p>
            </div>
            {{/if}}
        </div>

    </div>
</body>

</html>
