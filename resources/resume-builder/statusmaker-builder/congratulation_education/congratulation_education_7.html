        .imgCard img {
            object-fit: cover;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 10px solid lightslategray;
            -webkit-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
            -moz-box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
            box-shadow: -24px 84px 112px -47px rgba(0, 0, 0, 0.35);
        }

        .info {
            position: absolute;
            top: 68%;
            text-align: center;
            left: 50%;
            transform: translatex(-50%);
            width: 100%;
        }

        .studentName {
            text-align: center;
            font-size: 2rem;
            color: #3f638b;
            font-family: system-ui;
            position: absolute;
            top: 29%;
            left: 0;
            right: 0;
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #3f638b;
            font-family: system-ui;
        }

        .description {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 300;
            color: #3f638b;
            font-family: system-ui;
            padding: 1.4rem 7rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bg">
            <div class="">
                {{#if boy_name}}
                <div>
                    <h2 class="studentName">{{boy_name}}</h2>
                </div>
                {{/if}}

                {{#if image}}
                <div class="imgCard">
                    <img src="{{image}}" alt="">
                </div>
                {{/if}}

                <div class="info">
                    {{#if title}}
                    <div>
                        <h3 class="title">{{title}}</h3>
                    </div>
                    {{/if}}

                    {{#if description}}
                    <div class="description">
                        <p>{{description}}</p>
                    </div>
                    {{/if}}
                </div>


            </div>

        </div>


    </div>
</body>

</html>
