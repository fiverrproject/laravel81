<body>
    <div class="container">
        <div class="bg">
            <div style="display: flex; align-items: center;justify-content: center;">
                {{#if image}}
                <img src="{{image}}" height="500px" width="500px" style="border-bottom-left-radius: 50%;border-bottom-right-radius: 50%;">
                {{/if}}
            </div>
            <div style="text-align: center;position: inherit;top: 185px;">
                {{#if boy_name}}
                <h1>{{boy_name}}</h1>
                {{/if}}

                <span style="font-size: 2.4rem;text-align: center;">
                    &
                </span>

                {{#if girls_name}}
                <h1>{{girls_name}}</h1>
                {{/if}}

                {{#if date}}
                <h1 style="font-size: 2.4rem;text-align: center;">{{date}}</h1>
                {{/if}}
            </div>
        </div>
    </div>
</body>
