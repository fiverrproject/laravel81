<body>
    <div class="container bg">
        <div class="myImg">
            <img src="{{image}}" alt="">
        </div>

        <div>
            <p class="cong">CONGRATULATIONS</p>
        </div>

        <div class="box">
            <div>
                {{#if title}}
                <div class="title">
                    {{title}}
                </div>{{/if}}

                {{#if boy_name}}
                <div class="name">
                    <span style="margin-bottom: 0;">{{boy_name}}</span> <br>
                    {{#if girls_name}} <span style=" font-size: 1.5rem;">&</span> <br>
                    <span style="margin-top: 0;">{{girls_name}}</span> {{/if}}
                </div>
                {{/if}}

                {{#if description}}
                <div class="desc">
                    {{description}}
                </div>
                {{/if}}
            </div>

        </div>
    </div>
</body>

</html>
