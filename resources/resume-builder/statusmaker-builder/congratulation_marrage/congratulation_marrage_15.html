    <div class="container">
        <div class="bg">
            <div class="myImg">
                <img src="{{image}}" alt="">
            </div>

            <div class="cong">
                <p>Congratulations</p>
            </div>
            {{#if title}}
            <div class="title">
                <p>{{title}}</p>
            </div>
            {{/if}}

            {{#if boy_name}}
            <div class="name">
                <p style="margin-bottom: 0;">{{boy_name}}</p>
                {{#if girls_name}} <p style="margin: 0; font-size: 1.5rem;">&</p>
                <p style="margin-top: 0;">{{girls_name}}</p>
                {{/if}}
            </div>
            {{/if}}
        </div>
    </div>
</body>
