<body>
    <div class="container">
        <div class="bg">
            <div
                style="display: flex; align-items: center;justify-content: center;top:32%;position: absolute;left: 30%;">
                <div style="width: 450px;border-radius: 50%; height: 400px; border: 5px solid rgb(177 151 8);">
                    {{#if image}}
                    <img src="{{image}}"
                        height="100%" width="100%" style="border-radius: 50%">
                    {{/if}}
                </div>
            </div>
            <div style="position: inherit ; top: 75%;color: rgb(177 151 8);text-align: center;">
                {{#if boy_name}}
                <h1>{{boy_name}}</h1>
                {{/if}}

                <span style="font-size: 2.4rem;text-align: center;">
                    &
                </span>

                {{#if girls_name}}
                <h1>{{girls_name}}</h1>
                {{/if}}

                {{#if date}}
                <h1 style="font-size: 2.4rem;text-align: center;">{{date}}</h1>
                {{/if}}
            </div>
        </div>
    </div>
</body>

</html>
