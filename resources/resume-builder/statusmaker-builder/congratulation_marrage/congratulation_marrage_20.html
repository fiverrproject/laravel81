    <div class="container bg">

        <div class="myImg">
            <img src="{{image}}" alt="">

        <div class="name">
            <div>
                {{#if title}}
                <div class="title">
                    <p>{{title}}</p>
                </div>
                {{/if}}

                {{#if boy_name}} <div>
                    <p style="margin-bottom: 0;">{{boy_name}}</p>
                    {{#if girls_name}} <p style="margin: -20px;">&</p>
                    <p style="margin-top: 0;">{{girls_name}}</p>
                    {{/if}}
                </div>
                {{/if}}
            </div>
        </div>

        {{#if description}}
        <div class="description">
            {{description}}
        </div>
        {{/if}}


    </div>
</body>
